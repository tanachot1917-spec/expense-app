    else if(b.id==='s-xfer')transferSheet();
    else if(b.dataset.th){setTheme(b.dataset.th);document.querySelectorAll('#themes .thm').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.th===b.dataset.th);});}
    else if(b.id==='s-restore')document.getElementById('s-file').click();
  });
}
/* ปรับยอด: เทียบยอดสะสมทั้งหมดที่บันทึกไว้กับเงินจริง แล้วสร้างรายการ "ปรับยอด" เท่ากับส่วนต่าง */
function adjustSheet(accId){
  var cur=accById(accId)?accId:defAcc();
  function bal(){return Math.round(accBalances()[cur]*100)/100;}
  function signed(n){return (n<0?'−':'')+money(Math.abs(n));}
  openSheet('<h3>ปรับยอดคงเหลือ</h3><div class="chips" id="accs">'+accChipsHtml(cur,'acc')+'</div><p class="hint" id="a-info"></p><div class="amount"><span>฿</span><input id="f-amt" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="ยอดเงินจริง"></div>'+keypad('f-amt')+'<div class="err" id="err" role="alert"></div><div class="actions"><button type="button" class="btn ghost" id="a-cancel">ยกเลิก</button><button type="button" class="btn" id="a-save">ปรับยอด</button></div>');
  var sh=document.querySelector('.sheet'),err=document.getElementById('err'),inp=document.getElementById('f-amt');
  function info(){document.getElementById('a-info').innerHTML='ยอดในแอปของ <b>'+esc(accName(cur))+'</b> ตอนนี้: <b class="num">'+signed(bal())+'</b><br>ใส่ยอดจริงในบัญชีนี้ แอปจะบันทึกส่วนต่างเป็นรายการ "ปรับยอด"';}
  function preview(){
    var v=calc(inp.value),d=Math.round((v-bal())*100)/100;
    err.style.color='var(--muted)';
    err.textContent=isNaN(v)?'':(d===0?'ยอดตรงกันแล้ว':'จะบันทึก'+(d>0?'รายรับ +':'รายจ่าย −')+money(Math.abs(d)));
  }
  info();
  sh.addEventListener('input',function(e){if(e.target.id==='f-amt')preview();});
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.acc){cur=b.dataset.acc;sh.querySelectorAll('#accs .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.acc===cur);});info();preview();}
    else if(b.id==='a-cancel')closeSheet();
    else if(b.id==='a-save'){
      var v=calc(inp.value);
      if(isNaN(v)||v<0){err.style.color='';err.textContent='ใส่ยอดเงินจริง (0 ขึ้นไป)';return;}
      var d=Math.round((v-bal())*100)/100;
      if(d===0){closeSheet();toast('ยอดตรงกันแล้ว ไม่ต้องปรับ');return;}
      var today=ymd(new Date());
      S.month=today.slice(0,7);closeSheet();
      saveTx({id:uid(),type:d>0?'i':'e',amt:Math.abs(d),cat:'ปรับยอด',acc:cur,note:'ปรับยอด '+accName(cur),date:today});
      toast('ปรับยอด '+accName(cur)+' แล้ว '+(d>0?'+':'−')+money(Math.abs(d)));
    }
  });
}
/* โอนเงินระหว่างบัญชี (เช่น เติมเงินทรูมันนี่จากธนาคาร, ถอนเงินสด) ไม่นับเป็นรายรับรายจ่าย */
function transferSheet(t){
  if(S.accts.length<2){toast('ต้องมีอย่างน้อย 2 บัญชีถึงจะโอนได้');return;}
  var editing=!!t;
  var st={from:editing?accOf(t):defAcc(),to:editing&&accById(t.to)?t.to:''};
  if(!st.to){var o=S.accts.filter(function(a){return a.id!==st.from;})[0];st.to=o.id;}
  openSheet('<h3>'+(editing?'แก้ไขการโอน':'โอนระหว่างบัญชี')+'</h3><div class="hint" style="margin:0 0 6px">จาก</div><div class="chips" id="xf">'+accChipsHtml(st.from,'from')+'</div><div class="hint" style="margin:0 0 6px">ไปที่</div><div class="chips" id="xt">'+accChipsHtml(st.to,'to')+'</div><div class="amount"><span>฿</span><input id="f-amt" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="จำนวนเงิน" value="'+esc(editing?t.amt:'')+'"></div>'+keypad('f-amt')+'<div class="field"><div><label for="f-note">โน้ต</label><input id="f-note" type="text" maxlength="60" placeholder="เช่น เติมเงินวอลเลท" value="'+esc(editing?t.note:'')+'"></div><div><label for="f-date">วันที่</label><input id="f-date" type="date" value="'+esc(editing?t.date:ymd(new Date()))+'"></div></div><div class="err" id="err" role="alert"></div><div class="actions">'+(editing?'<button type="button" class="btn danger" id="x-del">ลบ</button>':'')+'<button type="button" class="btn ghost" id="x-cancel">ยกเลิก</button><button type="button" class="btn" id="x-save">บันทึก</button></div>');
  var sh=document.querySelector('.sheet');
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.from){st.from=b.dataset.from;sh.querySelectorAll('#xf .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.from===st.from);});}
    else if(b.dataset.to){st.to=b.dataset.to;sh.querySelectorAll('#xt .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.to===st.to);});}
    else if(b.id==='x-cancel')closeSheet();
    else if(b.id==='x-del'){closeSheet();delTx(t.id);}
    else if(b.id==='x-save'){
      var amt=calc(document.getElementById('f-amt').value),date=document.getElementById('f-date').value,err=document.getElementById('err');
      if(!(amt>0)){err.textContent='ใส่จำนวนเงินที่มากกว่า 0';return;}
      if(st.from===st.to){err.textContent='เลือกบัญชีต้นทางและปลายทางคนละบัญชี';return;}
      if(!date){err.textContent='เลือกวันที่';return;}
      var xnote=document.getElementById('f-note').value.trim();
      S.month=date.slice(0,7);S.lastAcc=st.from;closeSheet();
      saveTx({id:editing?t.id:uid(),type:'x',amt:amt,cat:'โอน',acc:st.from,to:st.to,note:xnote,date:date});
      toast('โอน '+money(amt)+' จาก '+accName(st.from)+' ไป '+accName(st.to));fxBurst('x',9);
    }
  });
}
/* จัดการบัญชี: เพิ่ม/เปลี่ยนชื่อ/สี/ลบ ถ้าลบบัญชี รายการของบัญชีนั้นย้ายไปบัญชีแรกที่เหลือ */
function accSheet(){
  var draft=S.accts.map(function(a){return {id:a.id,name:a.name,color:a.color};});
  openSheet('');
  var sh=document.querySelector('.sheet');
  function read(){
    sh.querySelectorAll('.crow').forEach(function(r){
      var d=draft[+r.dataset.i];if(!d)return;
      d.color=r.querySelector('.cc').value;d.name=r.querySelector('.cn').value;
    });
  }
  function paint(err){
    var rowsH=draft.map(function(d,i){
      return '<div class="crow noB" data-i="'+i+'"><input type="color" class="cc" aria-label="สี" value="'+esc(HEX.test(d.color)?d.color:'#7A8A96')+'"><input type="text" class="cn" maxlength="20" aria-label="ชื่อบัญชี" value="'+esc(d.name)+'"><button type="button" class="icon-btn del" data-del="'+i+'" aria-label="ลบบัญชี">×</button></div>';
    }).join('');
    sh.innerHTML='<h3>บัญชี / กระเป๋าเงิน</h3><p class="hint">เช่น ธนาคาร ทรูมันนี่วอลเลท เงินสด บัญชีแรกคือบัญชีของรายการเก่าที่ยังไม่ระบุบัญชี</p>'+rowsH+'<button type="button" class="btn ghost" id="c-add" style="width:100%;margin:4px 0 12px">+ เพิ่มบัญชี</button><p class="hint">ถ้าลบบัญชี รายการของบัญชีนั้นจะย้ายไปบัญชีแรกที่เหลือ</p><div class="err" id="err" role="alert">'+esc(err||'')+'</div><div class="actions"><button type="button" class="btn ghost" id="c-cancel">ยกเลิก</button><button type="button" class="btn" id="c-save">บันทึก</button></div>';
  }
  function apply(){
    var seen={},out=[],j;
    for(j=0;j<draft.length;j++){
      var n=draft[j].name.trim();
      if(!n)return 'ตั้งชื่อบัญชีให้ครบ';
      if(seen[n])return 'ชื่อบัญชี "'+n+'" ซ้ำ';
      seen[n]=1;out.push({id:draft[j].id,name:n,color:HEX.test(draft[j].color)?draft[j].color:'#7A8A96'});
    }
    /* ผูกรายการเก่าที่ไม่มี acc เข้ากับบัญชีแรกเดิมก่อน กันย้ายผิดบัญชีเมื่อลำดับเปลี่ยน */
    S.txs.forEach(function(t){if(!t.acc)t.acc=accOf(t);});
    S.rec.forEach(function(r){if(!r.acc)r.acc=accOf(r);});
    var keep={};out.forEach(function(a){keep[a.id]=1;});
    var first=out[0].id;
    S.txs.forEach(function(t){if(!keep[t.acc])t.acc=first;if(t.type==='x'&&!keep[t.to])t.to=first;});
    S.rec.forEach(function(r){if(!keep[r.acc])r.acc=first;});
    S.txs=S.txs.filter(function(t){return !(t.type==='x'&&t.acc===t.to);});
    S.accts=out;if(!keep[S.lastAcc])S.lastAcc='';
    localSave();return '';
  }
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.del!==undefined){
      read();
      if(draft.length<=1){paint('ต้องมีอย่างน้อย 1 บัญชี');return;}
      draft.splice(+b.dataset.del,1);paint();
    }
    else if(b.id==='c-add'){read();draft.push({id:uid(),name:'',color:PALETTE[draft.length%PALETTE.length]});paint();var ins=sh.querySelectorAll('.cn');ins[ins.length-1].focus();}
    else if(b.id==='c-cancel')closeSheet();
    else if(b.id==='c-save'){read();var msg=apply();if(msg)paint(msg);else{closeSheet();render();toast('บันทึกบัญชีแล้ว');}}
  });
  paint();
}
/* แก้หลายรายการพร้อมกัน: kind = cat | date | del ใช้กับรายการที่เลือกใน S.sel */
function bulkSheet(kind){
  var tx=selTx(),n=tx.length;
  if(!n){toast('ยังไม่ได้เลือกรายการ');return;}
  if(kind!=='date'&&kind!=='del'&&tx.some(function(t){return t.type==='x';})){toast('การโอนเงินแก้ได้เฉพาะวันที่หรือลบ');return;}
  var body;
  if(kind==='cat'){
    var k=tx[0].type;
    if(tx.some(function(t){return t.type!==k;})){toast('เลือกเฉพาะรายจ่ายหรือรายรับอย่างเดียวก่อนเปลี่ยนหมวด');return;}
    body='<h3>เปลี่ยนหมวด '+n+' รายการ</h3><div class="chips">'+S.cats[k].map(function(c){return '<button type="button" class="chip" data-cat="'+esc(c[0])+'">'+miniIcon(c[0],c[1])+esc(c[0])+'</button>';}).join('')+'</div><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button></div>';
  }else if(kind==='acc'){
    body='<h3>ย้ายบัญชี '+n+' รายการ</h3><div class="chips">'+accChipsHtml('','bacc')+'</div><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button></div>';
  }else if(kind==='date'){
    body='<h3>เปลี่ยนวันที่ '+n+' รายการ</h3><div class="field one"><div><label for="b-date">วันที่ใหม่</label><input id="b-date" type="date" value="'+ymd(new Date())+'"></div></div><div class="err" id="err" role="alert"></div><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button><button type="button" class="btn" id="b-ok">บันทึก</button></div>';
  }else{
    var s=sums(tx);
    body='<h3>ลบ '+n+' รายการ?</h3><p class="hint">รายรับ '+money(s.i)+' · รายจ่าย '+money(s.e)+' ลบแล้วยอดเงินในบัญชีจะกลับไปเหมือนไม่เคยมีรายการเหล่านี้ (กด "กู้คืน" ได้ภายในไม่กี่วินาที)</p><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button><button type="button" class="btn danger" style="flex:1" id="b-ok">ลบ '+n+' รายการ</button></div>';
  }
  openSheet(body);
  function finish(msg){S.sel=null;localSave();closeSheet();render();toast(msg);}
  document.querySelector('.sheet').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='b-cancel')closeSheet();
    else if(b.dataset.cat){tx.forEach(function(t){t.cat=b.dataset.cat;});finish('เปลี่ยนหมวด '+n+' รายการแล้ว');}
    else if(b.dataset.bacc){tx.forEach(function(t){t.acc=b.dataset.bacc;});finish('ย้าย '+n+' รายการไป '+accName(b.dataset.bacc)+' แล้ว');}
    else if(b.id==='b-ok'&&kind==='date'){
      var d=document.getElementById('b-date').value;
      if(!d){document.getElementById('err').textContent='เลือกวันที่';return;}
      tx.forEach(function(t){t.date=d;});S.month=d.slice(0,7);finish('เปลี่ยนวันที่ '+n+' รายการแล้ว');
    }
    else if(b.id==='b-ok'){var ids={},gone=tx.slice();gone.forEach(function(t){ids[t.id]=1;});S.txs=S.txs.filter(function(t){return !ids[t.id];});S.sel=null;localSave();closeSheet();render();undoDelete(gone,'ลบ '+n+' รายการแล้ว');}
  });
}
var PALETTE=['#E2703A','#2F7FD1','#8A5CD6','#D6A21E','#2BA58F','#D6477A','#6F8A2E','#C0392B','#16A085','#7F8C8D'];
function catSheet(){
  function mk(c){return {orig:c[0],name:c[0],color:c[1],b:S.cb[c[0]]||''};}
  var type='e',draft={e:S.cats.e.map(mk),i:S.cats.i.map(mk)};
  openSheet('');
  var sh=document.querySelector('.sheet');
  function read(){
    sh.querySelectorAll('.crow').forEach(function(r){
      var d=draft[type][+r.dataset.i];if(!d)return;
      d.color=r.querySelector('.cc').value;d.name=r.querySelector('.cn').value;
      var b=r.querySelector('.cb');if(b)d.b=b.value;
    });
  }
  function paint(err){
    var rowsH=draft[type].map(function(d,i){
      return '<div class="crow'+(type==='e'?'':' noB')+'" data-i="'+i+'"><input type="color" class="cc" aria-label="สี" value="'+esc(HEX.test(d.color)?d.color:'#7A8A96')+'"><input type="text" class="cn" maxlength="20" aria-label="ชื่อหมวด" value="'+esc(d.name)+'">'+(type==='e'?'<input type="text" class="cb" inputmode="decimal" aria-label="งบต่อเดือน" placeholder="งบ/เดือน" value="'+esc(d.b)+'">':'')+'<button type="button" class="icon-btn del" data-del="'+i+'" aria-label="ลบหมวด">×</button></div>';
    }).join('');
    sh.innerHTML='<h3>หมวดหมู่</h3><div class="seg neutral" style="margin:0 0 12px"><button type="button" data-t="e" aria-pressed="'+(type==='e')+'">รายจ่าย</button><button type="button" data-t="i" aria-pressed="'+(type==='i')+'">รายรับ</button></div>'+(type==='e'?'<p class="hint">ช่องขวาคืองบต่อเดือนของหมวดนั้น เว้นว่างถ้าไม่ต้องการตั้งงบ</p>':'')+rowsH+'<button type="button" class="btn ghost" id="c-add" style="width:100%;margin:4px 0 12px">+ เพิ่มหมวด</button><p class="hint">ถ้าลบหมวด รายการเก่าที่ใช้หมวดนั้นจะยังอยู่ (แสดงเป็นสีเทา) ถ้าเปลี่ยนชื่อ รายการเก่าจะเปลี่ยนตามให้</p><div class="err" id="err" role="alert">'+esc(err||'')+'</div><div class="actions"><button type="button" class="btn ghost" id="c-cancel">ยกเลิก</button><button type="button" class="btn" id="c-save">บันทึก</button></div>';
  }
  function apply(){
    var res={},msg='';
    var ok=['e','i'].every(function(k){
      var seen={},arr=[],where=' (แท็บ'+(k==='e'?'รายจ่าย':'รายรับ')+')';
      for(var j=0;j<draft[k].length;j++){
        var d=draft[k][j],n=d.name.trim();
        if(!n){msg='ตั้งชื่อหมวดให้ครบ'+where;return false;}
        if(seen[n]){msg='ชื่อหมวด "'+n+'" ซ้ำ'+where;return false;}
        seen[n]=1;arr.push({orig:d.orig,name:n,color:HEX.test(d.color)?d.color:'#7A8A96',b:calc(d.b)||0});
      }
      res[k]=arr;return true;
    });
    if(!ok)return msg;
    ['e','i'].forEach(function(k){
      var ren={};res[k].forEach(function(d){if(d.orig&&d.orig!==d.name)ren[d.orig]=d.name;});
      function fix(x){if(x.type===k&&Object.prototype.hasOwnProperty.call(ren,x.cat))x.cat=ren[x.cat];}
      S.txs.forEach(fix);S.rec.forEach(fix);
      S.cats[k]=res[k].map(function(d){return [d.name,d.color];});
    });
    S.cb={};res.e.forEach(function(d){if(d.b>0)S.cb[d.name]=d.b;});
    localSave();
    return '';
  }
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.t){read();type=b.dataset.t;paint();}
    else if(b.dataset.del!==undefined){
      read();
      if(draft[type].length<=1){paint('ต้องมีอย่างน้อย 1 หมวด');return;}
      draft[type].splice(+b.dataset.del,1);paint();
    }
    else if(b.id==='c-add'){read();draft[type].push({orig:'',name:'',color:PALETTE[draft[type].length%PALETTE.length],b:''});paint();var ins=sh.querySelectorAll('.cn');ins[ins.length-1].focus();}
    else if(b.id==='c-cancel')closeSheet();
    else if(b.id==='c-save'){read();var msg=apply();if(msg)paint(msg);else{closeSheet();render();toast('บันทึกหมวดหมู่แล้ว');}}
  });
  paint();
}

/* เตือนสำรองข้อมูล: เก็บวันที่สำรองล่าสุดใน rr_lastbak และวันที่ซ่อนการเตือนใน rr_baksnooze (ไม่ใช่ข้อมูลรายการ) */
function lsGet(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function daysSince(d){if(!d)return -1;var n=Math.round((new Date(ymd(new Date()))-new Date(d))/864e5);return isNaN(n)?-1:n;}
function markBackup(){lsSet('rr_lastbak',ymd(new Date()));lsSet('rr_baksnooze','');}
function bakLine(){var d=daysSince(lsGet('rr_lastbak'));return '<b>สำรองล่าสุด: '+(d<0?'ยังไม่เคย':(d===0?'วันนี้':d+' วันก่อน'))+'</b><br>';}
function backupBanner(){
  if(S.txs.length<3)return '';
  var d=daysSince(lsGet('rr_lastbak'));
  if(d>=0&&d<7)return '';
  var sn=lsGet('rr_baksnooze');if(sn&&sn>ymd(new Date()))return '';
  return '<div class="banner bak" role="status"><span>'+(d<0?'ยังไม่เคยสำรองข้อมูล':'ไม่ได้สำรองข้อมูลมา '+d+' วันแล้ว')+' ข้อมูลอยู่ในเครื่องนี้เท่านั้น</span><span class="bakacts"><button type="button" class="link" data-act="bak-now">สำรองเลย</button><button type="button" class="link" data-act="bak-later">ไว้ก่อน</button></span></div>';
}
function saveFile(name,text,type){var u=URL.createObjectURL(new Blob([text],{type:type}));var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}
function backup(){if(!S.txs.length&&!S.rec.length&&!S.goals.length){toast('ยังไม่มีข้อมูลให้สำรอง');return;}saveFile('รายรับรายจ่าย-สำรอง-'+ymd(new Date())+'.json',JSON.stringify({v:3,budget:S.budget,txs:S.txs,cats:S.cats,cb:S.cb,rec:S.rec,accts:S.accts,goals:S.goals}),'application/json');markBackup();toast('สำรองข้อมูลแล้ว');}
document.addEventListener('change',function(e){
  if(e.target.id!=='s-file'||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.txs))throw 0;
    var ids={};S.txs.forEach(function(t){ids[t.id]=1;});var n=0;
    d.txs.forEach(function(t){if(t&&t.id&&t.date&&t.amt>0&&(t.type==='i'||t.type==='e'||(t.type==='x'&&t.to))&&!ids[t.id]){var x={id:String(t.id),type:t.type,amt:+t.amt,cat:String(t.cat||'อื่นๆ'),note:String(t.note||''),date:String(t.date)};if(t.rid)x.rid=String(t.rid);if(t.acc)x.acc=String(t.acc);if(t.type==='x')x.to=String(t.to);S.txs.push(x);n++;}});
    if(!S.budget&&d.budget>0)S.budget=+d.budget;
    if(d.cats&&typeof d.cats==='object')['e','i'].forEach(function(k){(cleanCats(d.cats[k])||[]).forEach(function(c){if(!S.cats[k].some(function(x){return x[0]===c[0];}))S.cats[k].push(c);});});
    (cleanAccts(d.accts)||[]).forEach(function(a){if(!accById(a.id))S.accts.push(a);});
    var cb=cleanCb(d.cb);Object.keys(cb).forEach(function(k){if(!S.cb[k])S.cb[k]=cb[k];});
    var rids={};S.rec.forEach(function(r){rids[r.id]=1;});cleanRec(d.rec).forEach(function(r){if(!rids[r.id])S.rec.push(r);});
    var gids={};S.goals.forEach(function(g){gids[g.id]=1;});cleanGoals(d.goals).forEach(function(g){if(!gids[g.id])S.goals.push(g);});
    localSave();closeSheet();render();toast('นำเข้า '+n+' รายการ');
  }catch(x){toast('ไฟล์สำรองไม่ถูกต้อง');}};r.readAsText(e.target.files[0]);
});
function exportCsv(){
  var rowsOut=S.txs.slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(t){return [t.date,t.type==='i'?'รายรับ':(t.type==='x'?'โอน':'รายจ่าย'),t.cat,t.amt,'"'+(accName(accOf(t))+(t.type==='x'?' → '+accName(t.to):'')).replace(/"/g,'""')+'"','"'+(t.note||'').replace(/"/g,'""')+'"'].join(',');});
  if(!rowsOut.length){toast('ยังไม่มีข้อมูลให้ส่งออก');return;}
  var csv='﻿วันที่,ประเภท,หมวด,จำนวนเงิน,บัญชี,โน้ต\n'+rowsOut.join('\n');
  function fallback(){openSheet('<h3>ส่งออก CSV</h3><p style="font-size:13px;color:var(--muted);margin-bottom:8px">คัดลอกข้อความนี้ไปวางใน Excel หรือ Google Sheets</p><textarea id="csv" readonly>'+esc(csv)+'</textarea><div class="actions"><button type="button" class="btn ghost" id="c-close">ปิด</button><button type="button" class="btn" id="c-copy">คัดลอก</button></div>');
    document.querySelector('.sheet').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='c-close')closeSheet();if(b.id==='c-copy'){var ta=document.getElementById('csv');ta.select();try{navigator.clipboard.writeText(csv).then(function(){toast('คัดลอกแล้ว');},function(){document.execCommand&&document.execCommand('copy');});}catch(x){}}});}
  if(true){saveFile('รายรับรายจ่าย-'+ymd(new Date())+'.csv',csv,'text/csv;charset=utf-8');toast('ส่งออกแล้ว');closeSheet();}
  else fallback();
}

/* ---------- events ---------- */
(function(){
  var fab=document.getElementById('fab'),tm=0,long=false;
  function start(){long=false;clearTimeout(tm);tm=setTimeout(function(){long=true;try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}quickSheet();},450);}
  function stop(){clearTimeout(tm);}
  fab.addEventListener('pointerdown',start);
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){fab.addEventListener(n,stop);});
  fab.addEventListener('contextmenu',function(e){e.preventDefault();});
  fab.addEventListener('click',function(){if(long){long=false;return;}entrySheet();});
})();
document.getElementById('tab-home').addEventListener('click',function(){S.tab='home';render();});
document.getElementById('tab-stats').addEventListener('click',function(){S.tab='stats';S.sel=null;render();});
document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=b.dataset.act,t;
  if(a==='prev'||a==='next'){var p=S.month.split('-'),step=(yearMode()?12:1)*(a==='next'?1:-1),d=new Date(+p[0],+p[1]-1+step,1);S.month=ym(d);S.fYear='';S.selDay=0;render();}
  else if(a==='settings')settingsSheet();
  else if(a==='bak-now'){backup();render();}
  else if(a==='bak-later'){var sn=new Date();sn.setDate(sn.getDate()+3);lsSet('rr_baksnooze',ymd(sn));render();}
  else if(a==='sm-m'||a==='sm-y'){S.sm=a==='sm-y'?'y':'m';render();}
  else if(a==='gomonth'){S.month=b.dataset.m;S.fYear='';S.tab='home';render();}
  else if(a==='drill'){
    var yrm=yearMode();
    S.fType=b.dataset.type||'';S.fCat=b.dataset.cat||'';S.fAcc=b.dataset.acc||'';S.q='';S.fAll=false;S.fYear=yrm?S.month.slice(0,4):'';
    S.tab='home';S.sel=null;render();window.scrollTo(0,0);
  }
  else if(a==='clear-year'){S.fYear='';render();}
  else if(a==='dm-d'||a==='dm-c'){S.dm=a==='dm-c'?'c':'d';refreshDaily();}
  else if(a==='dd-prev'||a==='dd-next'){
    var nd2=daysIn(S.month),now2=new Date(),cur2=S.selDay>=1&&S.selDay<=nd2?S.selDay:(S.month===ym(now2)?now2.getDate():1);
    S.selDay=Math.min(nd2,Math.max(1,cur2+(a==='dd-next'?1:-1)));refreshDaily();
  }
  else if(a==='clear-filters'){S.q='';S.fType='';S.fCat='';S.fAcc='';S.fYear='';S.fAll=false;render();}
  else if(a==='adjust')adjustSheet();
  else if(a==='adj-acc')adjustSheet(b.dataset.a);
  else if(a==='transfer')transferSheet();
  else if(a==='goals')goalsSheet();
  else if(a==='goal-dep')goalDepositSheet(b.dataset.g);
  else if(a==='edit-budget')inlineEdit(b,S.budget||'',true,saveBudget);
  else if(a==='sel'){S.sel=S.sel?null:{};render();}
  else if(a==='sel-all'){var vis=filtered(),all=vis.length&&vis.every(function(x){return S.sel[x.id];});S.sel={};if(!all)vis.forEach(function(x){S.sel[x.id]=1;});renderList();}
  else if(a==='sel-cat'||a==='sel-acc'||a==='sel-date'||a==='sel-del')bulkSheet(a.slice(4));
  else if(b.dataset.amt){t=S.txs.find(function(x){return x.id===b.dataset.amt;});if(t)inlineEdit(b,t.amt,false,function(n){var was={type:t.type,date:t.date,cat:t.cat,amt:t.amt};t.amt=n;saveTx(t);var al=budgetAlert(t,was);if(al)toast(al);});}
  else if(b.dataset.id){
    if(S.sel){if(S.sel[b.dataset.id])delete S.sel[b.dataset.id];else S.sel[b.dataset.id]=1;renderList();}
    else{t=S.txs.find(function(x){return x.id===b.dataset.id;});if(t){if(t.type==='x')transferSheet(t);else entrySheet(t);}}
  }
});
document.getElementById('app').addEventListener('click',function(e){
  var el=e.target.closest('[data-day]');
  if(el){S.selDay=+el.dataset.day;refreshDaily();}
});
document.getElementById('app').addEventListener('input',function(e){if(e.target.id==='f-q'){S.q=e.target.value;renderList();}});
document.getElementById('app').addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-type')S.fType=e.target.value;
  else if(id==='f-cat')S.fCat=e.target.value;
  else if(id==='f-acc')S.fAcc=e.target.value;
  else if(id==='f-all')S.fAll=e.target.checked;
  else return;
  renderList();
});
initStore();
render();
if(lockCfg())showLock();else document.documentElement.classList.remove('locked');
})();
</script>
</body>
</html>
