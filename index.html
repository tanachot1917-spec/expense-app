<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดรายรับรายจ่าย</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2446C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: single-column phone ledger. Summary card on top, day-grouped list, bottom tabs, sheet for entry. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#12212A; --muted:#5E727D; --line:#D9E1E5;
  --accent:#2446C4; --accent-ink:#FFFFFF; --inc:#12805A; --exp:#C73B2E; --inc-bg:#DFF3EA; --exp-bg:#FBE4E1;
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --surface:#16232A; --ink:#E7EEF1; --muted:#90A4AE; --line:#27373F;
    --accent:#7C95FF; --accent-ink:#0E171C; --inc:#4CCB98; --exp:#FF8A7D; --inc-bg:#12372B; --exp-bg:#3E1E1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#16232A; --ink:#E7EEF1; --muted:#90A4AE; --line:#27373F;
  --accent:#7C95FF; --accent-ink:#0E171C; --inc:#4CCB98; --exp:#FF8A7D; --inc-bg:#12372B; --exp-bg:#3E1E1B;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:12px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:18px;font-weight:600;min-width:140px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.icon-btn:hover{background:var(--surface)}
.card{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.bal-label{color:var(--muted);font-size:13px}
.bal{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.bal.neg{color:var(--exp)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pill{border-radius:14px;padding:10px 12px}
.pill small{display:block;font-size:12px;color:var(--muted)}
.pill b{font-size:18px;font-weight:600}
.pill.inc{background:var(--inc-bg)} .pill.inc b{color:var(--inc)}
.pill.exp{background:var(--exp-bg)} .pill.exp b{color:var(--exp)}
.budget{margin-top:14px}
.budget .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;gap:8px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.fill.warn{background:#D6A21E} .fill.over{background:var(--exp)}
.link{color:var(--accent);font-weight:500;font-size:13px;padding:4px 0}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--muted)}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.day{margin-top:14px}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.dot{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--muted)}
.amt{font-weight:600}
.amt.i{color:var(--inc)} .amt.e{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
.bars .b{margin-bottom:12px}
.bars .bh{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bars .bh span:last-child{color:var(--muted)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:18px;font-weight:600}
svg text{fill:var(--muted);font-family:var(--font);font-size:10px}
.gridline{stroke:var(--line);stroke-width:1}
.bar{fill:var(--exp)} .bar.future{fill:var(--line)}
.avg{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center}
nav .tab{padding:8px;font-size:13px;color:var(--muted);font-weight:500;border-radius:12px}
nav .tab[aria-current="page"]{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;margin:-26px auto 0;box-shadow:0 6px 18px rgba(36,70,196,.35);display:grid;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:9px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].e{background:var(--exp);color:#fff}
.seg button[aria-pressed="true"].i{background:var(--inc);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E171C}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E171C}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.amount span{font-size:26px;color:var(--muted)}
.amount input{border:0;background:none;font-size:38px;font-weight:700;width:100%;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--bg);font-weight:600}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.field.one{grid-template-columns:1fr}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.actions{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{flex:none;background:var(--exp-bg);color:var(--exp);padding:13px 18px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:-6px 0 8px}
textarea{width:100%;height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:12px;margin-bottom:12px}
.filters{margin-top:14px}
.filters input[type=search],.filters select,.crow input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fopt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.result{font-size:12px;color:var(--muted);margin:10px 4px 0;display:flex;justify-content:space-between;gap:8px}
.seg.neutral{margin:14px 0 0}
.seg.neutral button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar.inc{fill:var(--inc)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.crow{display:grid;grid-template-columns:40px 1fr 90px 36px;gap:8px;align-items:center;margin-bottom:8px}
.crow.noB{grid-template-columns:40px 1fr 36px}
.crow input[type=color]{width:40px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.crow .del{width:36px;height:36px;color:var(--exp);font-size:22px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.trow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left}
.trow+.trow{border-top:1px solid var(--line)}
.trow .m{flex:1}
.trow small{color:var(--muted);font-size:12px}
.txmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.amt-btn{padding:6px 8px;margin:-6px -8px;border-radius:8px}
.amt-btn:hover,.bud-btn:hover{background:var(--bg)}
.bud-btn{border-radius:6px;text-decoration:underline dotted;text-underline-offset:3px}
.inl{width:120px;padding:6px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--bg);text-align:right;font-weight:600}
button.bal{display:block;text-align:left;border-radius:8px}
.calc-out{min-height:20px;font-size:13px;color:var(--muted);margin:-8px 0 8px;text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.key{padding:6px 0;border-radius:12px;background:var(--bg);font-size:18px;font-weight:600}
.key.op{color:var(--accent)}
.key:active{background:var(--line)}
.selbar{position:sticky;top:8px;z-index:4;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.selbar div{display:flex;gap:4px}
.selbar button{color:var(--bg);font-weight:600;padding:6px 9px;border-radius:8px;border:1px solid currentColor}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in">
  <button class="tab" id="tab-home" aria-current="page">รายการ</button>
  <button class="fab" id="fab" aria-label="เพิ่มรายการ">+</button>
  <button class="tab" id="tab-stats">สรุป</button>
</div></nav>
<div id="layer"></div>

<script>
(function(){
'use strict';
var EXP=[['อาหาร','#E2703A'],['เดินทาง','#2F7FD1'],['ช้อปปิ้ง','#8A5CD6'],['ค่าเช่า/บิล','#D6A21E'],['เรียน','#2BA58F'],['สุขภาพ/ฟิตเนส','#D6477A'],['สันทนาการ','#6F8A2E'],['อื่นๆ','#7A8A96']];
var INC=[['เงินจากบ้าน','#2BA58F'],['งานพิเศษ/ขาย','#2F7FD1'],['ลงทุน','#8A5CD6'],['อื่นๆ','#7A8A96']];
var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function copyCats(a){return a.map(function(c){return [c[0],c[1]];});}
function defCats(){return {e:copyCats(EXP),i:copyCats(INC)};}
function colorOf(cat,type){var a=S.cats[type]||[];for(var i=0;i<a.length;i++)if(a[i][0]===cat)return a[i][1];return '#7A8A96';}

/* S.cats = หมวดหมู่ที่แก้ได้, S.cb = งบรายหมวด (เฉพาะรายจ่าย), S.rec = รายการประจำ, S.sm = โหมดสรุป m(เดือน)/y(ปี), S.sel = id ที่เลือกในโหมดเลือกหลายรายการ (null = ปิด) */
var S={txs:[],budget:0,cats:defCats(),cb:{},rec:[],month:ym(new Date()),tab:'home',sm:'m',q:'',fType:'',fCat:'',fAll:false,sel:null};

function pad(n){return n<10?'0'+n:''+n;}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function ymd(d){return ym(d)+'-'+pad(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var NF=new Intl.NumberFormat('th-TH',{maximumFractionDigits:2});
function money(n){return '฿'+NF.format(Math.round(n*100)/100);}
function dateOf(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function monthLabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function dayLabel(s){
  var d=dateOf(s),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(s===ymd(t))return 'วันนี้';
  if(s===ymd(y))return 'เมื่อวาน';
  var o={weekday:'short',day:'numeric',month:'short'};
  if(d.getFullYear()!==t.getFullYear())o.year='numeric';
  return d.toLocaleDateString('th-TH',o);
}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- example data (memory only, never saved) ---------- */
function demo(){
  var now=new Date(),m=ym(now),out=[],i=0;
  function add(day,type,amt,cat,note){var d=new Date(now.getFullYear(),now.getMonth(),day);if(d>now)return;out.push({id:'demo'+(i++),type:type,amt:amt,cat:cat,note:note,date:ymd(d),demo:true});}
  add(1,'i',8000,'เงินจากบ้าน','ค่าใช้จ่ายรายเดือน');
  add(1,'e',3500,'ค่าเช่า/บิล','ค่าหอ');
  add(2,'e',65,'อาหาร','ข้าวมันไก่');
  add(3,'e',120,'เดินทาง','ค่าน้ำมัน');
  add(4,'e',480,'เรียน','หนังสือสถิติ');
  add(5,'i',1200,'งานพิเศษ/ขาย','ขายของออนไลน์');
  add(6,'e',289,'สุขภาพ/ฟิตเนส','เวย์โปรตีน');
  add(8,'e',75,'อาหาร','ก๋วยเตี๋ยว');
  add(9,'e',350,'สันทนาการ','บอร์ดเกมคาเฟ่');
  add(10,'e',90,'อาหาร','กาแฟ + ขนม');
  add(12,'e',690,'ช้อปปิ้ง','เสื้อ');
  add(13,'e',55,'อาหาร','ข้าวกะเพรา');
  return out;
}
function isDemo(){return !S.txs.length;}
function list(){return isDemo()?demo():S.txs;}

/* ---------- storage ---------- */
var HEX=/^#[0-9a-fA-F]{6}$/;
function cleanCats(a){
  if(!Array.isArray(a))return null;
  var out=[],seen={};
  a.forEach(function(c){if(Array.isArray(c)&&typeof c[0]==='string'&&c[0].trim()&&!seen[c[0].trim()]){var n=c[0].trim().slice(0,20);seen[n]=1;out.push([n,HEX.test(c[1])?c[1]:'#7A8A96']);}});
  return out.length?out:null;
}
function cleanCb(o){var out={};if(o&&typeof o==='object')Object.keys(o).forEach(function(k){var v=+o[k];if(v>0&&isFinite(v))out[k]=v;});return out;}
function cleanRec(a){
  var out=[];
  if(Array.isArray(a))a.forEach(function(r){
    if(r&&r.id&&(r.type==='i'||r.type==='e')&&r.amt>0&&r.day>=1&&r.day<=31&&/^\d{4}-\d{2}$/.test(r.start))
      out.push({id:String(r.id),type:r.type,amt:+r.amt,cat:String(r.cat||'อื่นๆ'),note:String(r.note||''),day:Math.floor(r.day),start:r.start,done:/^\d{4}-\d{2}$/.test(r.done)?r.done:''});
  });
  return out;
}
function localLoad(){
  try{S.txs=JSON.parse(localStorage.getItem('rr_tx')||'[]');S.budget=+localStorage.getItem('rr_budget')||0;}catch(e){}
  try{
    var c=JSON.parse(localStorage.getItem('rr_cats')||'null');
    if(c){S.cats={e:cleanCats(c.e)||copyCats(EXP),i:cleanCats(c.i)||copyCats(INC)};}
    S.cb=cleanCb(JSON.parse(localStorage.getItem('rr_cb')||'{}'));
    S.rec=cleanRec(JSON.parse(localStorage.getItem('rr_rec')||'[]'));
  }catch(e){}
}
function localSave(){
  try{
    localStorage.setItem('rr_tx',JSON.stringify(S.txs));localStorage.setItem('rr_budget',String(S.budget));
    localStorage.setItem('rr_cats',JSON.stringify(S.cats));localStorage.setItem('rr_cb',JSON.stringify(S.cb));localStorage.setItem('rr_rec',JSON.stringify(S.rec));
  }catch(e){toast('บันทึกไม่สำเร็จ พื้นที่อาจเต็ม');}
}
/* สร้างรายการจากรายการประจำ: เดือนที่ยังไม่สร้างจนถึงเดือนนี้ (เฉพาะวันที่ที่ถึงแล้ว) คืนจำนวนที่สร้าง */
function nextYm(m){var p=m.split('-');return ym(new Date(+p[0],+p[1],1));}
function genRecurring(){
  var today=ymd(new Date()),cur=today.slice(0,7),n=0;
  S.rec.forEach(function(r){
    var m=r.done?nextYm(r.done):r.start;
    while(m<=cur){
      var date=m+'-'+pad(Math.min(r.day,daysIn(m)));
      if(date>today)break;
      S.txs.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:date,rid:r.id});
      r.done=m;n++;m=nextYm(m);
    }
  });
  if(n)localSave();
  return n;
}
function saveRec(r){var k=S.rec.findIndex(function(x){return x.id===r.id;});if(k>=0)S.rec[k]=r;else S.rec.push(r);localSave();}
function delRec(id){S.rec=S.rec.filter(function(x){return x.id!==id;});localSave();}

/* ---------- เครื่องคิดเลข: คำนวณ + − × ÷ โดยไม่ใช้ eval คืน NaN ถ้ารูปแบบผิด ---------- */
function calc(s){
  s=String(s==null?'':s).replace(/[,\s]/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  var tok=s.match(/\d+\.?\d*|\.\d+|[+\-*\/]/g);
  if(!tok||tok.join('')!==s)return NaN;
  while(tok.length&&/^[+\-*\/]$/.test(tok[tok.length-1]))tok.pop();
  var nums=[],ops=[],want=true,sign=1,i;
  for(i=0;i<tok.length;i++){
    var t=tok[i],isOp=/^[+\-*\/]$/.test(t);
    if(want){
      if(t==='-'){sign=-sign;continue;}
      if(t==='+')continue;
      if(isOp)return NaN;
      nums.push(sign*parseFloat(t));sign=1;want=false;
    }else{
      if(!isOp)return NaN;
      ops.push(t);want=true;
    }
  }
  if(want||!nums.length)return NaN;
  var n2=[nums[0]],o2=[];
  for(i=0;i<ops.length;i++){
    if(ops[i]==='*')n2[n2.length-1]*=nums[i+1];
    else if(ops[i]==='/')n2[n2.length-1]/=nums[i+1];
    else{o2.push(ops[i]);n2.push(nums[i+1]);}
  }
  var r=n2[0];
  for(i=0;i<o2.length;i++)r=o2[i]==='+'?r+n2[i+1]:r-n2[i+1];
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
var KEYS=['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'],OPS=/[÷×−+]/;
function keypad(target){return '<div class="calc-out num" data-for="'+target+'"></div><div class="pad">'+KEYS.map(function(k){return '<button type="button" class="key'+(OPS.test(k)?' op':'')+'" data-k="'+k+'" data-for="'+target+'"'+(k==='⌫'?' aria-label="ลบหนึ่งตัว"':'')+'>'+k+'</button>';}).join('')+'</div>';}
function padPress(inp,k){
  var v=inp.value;
  if(k==='⌫')v=v.slice(0,-1);
  else if(OPS.test(k)){if(!v)return;if(OPS.test(v.slice(-1)))v=v.slice(0,-1);v+=k;}
  else if(k==='.'){var last=v.split(OPS).pop();if(last.indexOf('.')>=0)return;v+=(last?'':'0')+'.';}
  else v+=k;
  inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function padOut(inp,out){var v=inp.value,n=calc(v);out.textContent=/[÷×−+*\/\-]/.test(v.slice(1))&&!isNaN(n)?'= '+money(n):'';}

/* ---------- derived ---------- */
function monthTx(){return list().filter(function(t){return t.date.slice(0,7)===S.month;});}
function yearTx(){var y=S.month.slice(0,4);return list().filter(function(t){return t.date.slice(0,4)===y;});}
function yearMode(){return S.tab==='stats'&&S.sm==='y';}
function yearLabel(){return new Date(+S.month.slice(0,4),0,1).toLocaleDateString('th-TH',{year:'numeric'});}
function catNames(){var seen={},out=[];['e','i'].forEach(function(k){S.cats[k].forEach(function(c){if(!seen[c[0]]){seen[c[0]]=1;out.push(c[0]);}});});S.txs.forEach(function(t){if(!seen[t.cat]){seen[t.cat]=1;out.push(t.cat);}});return out;}
function filtered(){
  var q=S.q.trim().toLowerCase();
  return list().filter(function(t){
    if(!S.fAll&&t.date.slice(0,7)!==S.month)return false;
    if(S.fType&&t.type!==S.fType)return false;
    if(S.fCat&&t.cat!==S.fCat)return false;
    if(q&&((t.note||'')+' '+t.cat).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function filtering(){return !!(S.q.trim()||S.fType||S.fCat||S.fAll);}
function selTx(){var s=S.sel||{};return S.txs.filter(function(t){return s[t.id];});}
function sums(tx){var i=0,e=0;tx.forEach(function(t){if(t.type==='i')i+=t.amt;else e+=t.amt;});return {i:i,e:e};}
function daysIn(m){var p=m.split('-');return new Date(+p[0],+p[1],0).getDate();}

function listBody(){

function listView(tx){

    });

function statsView(tx,s){
  var ex=tx.filter(function(t){return t.type==='e';});
  if(!ex.length)return '<div class="empty">ยังไม่มีรายจ่ายในเดือนนี้ให้สรุป</div>';
  var byCat={};ex.forEach(function(t){byCat[t.cat]=(byCat[t.cat]||0)+t.amt;});
  var n=daysIn(S.month),now=new Date(),isCur=S.month===ym(now),elapsed=isCur?now.getDate():n;
  var perDay=new Array(n).fill(0);ex.forEach(function(t){perDay[+t.date.slice(8)-1]+=t.amt;});
  var avg=s.e/elapsed,maxDay=0,maxIdx=0;perDay.forEach(function(v,i){if(v>maxDay){maxDay=v;maxIdx=i;}});
  var h='<div class="stats-grid" style="margin-top:16px"><div class="stat"><small>ใช้เฉลี่ยต่อวัน</small><b class="num">'+money(avg)+'</b></div><div class="stat"><small>วันที่ใช้มากสุด</small><b class="num">'+money(maxDay)+'</b><small>วันที่ '+(maxIdx+1)+'</small></div>';
  if(S.budget>0&&isCur){var rem=n-now.getDate()+1,left=S.budget-s.e;h+='<div class="stat" style="grid-column:1/-1"><small>ใช้ได้ต่อวันตลอดเดือนที่เหลือ ('+rem+' วัน)</small><b class="num">'+(left>0?money(left/rem):'เกินงบแล้ว')+'</b></div>';}
  h+='</div>';
  h+='<h2><span>รายจ่ายรายวัน</span><span>เส้นประ = ค่าเฉลี่ย</span></h2><div class="card" style="padding:12px">'+chart(perDay,elapsed,avg)+'</div>';
  h+='<h2><span>แยกตามหมวด</span><span class="num">'+money(s.e)+'</span></h2>'+catBars(byCat,s.e,true);
  return h;
}
/* แท่งสรุปตามหมวด: ถ้าหมวดมีงบ (useBudget) แท่งจะวัดเทียบงบของหมวดนั้น ไม่งั้นวัดเป็น % ของรายจ่ายทั้งหมด */
function catBars(byCat,total,useBudget){
  var names=Object.keys(byCat);
  if(useBudget)Object.keys(S.cb).forEach(function(c){if(names.indexOf(c)<0)names.push(c);});
  names.sort(function(a,b){return (byCat[b]||0)-(byCat[a]||0);});
  var h='<div class="card bars">';
  names.forEach(function(c){
    var v=byCat[c]||0,b=useBudget?(S.cb[c]||0):0,col=colorOf(c,'e');
    if(b>0){
      var pct=v/b*100,fill=pct>100?'var(--exp)':(pct>80?'#D6A21E':col);
      h+='<div class="b"><div class="bh"><span>'+esc(c)+'</span><span class="num">'+money(v)+' / '+money(b)+'</span></div><div class="track" role="progressbar" aria-label="'+esc(c)+'" aria-valuemin="0" aria-valuemax="'+b+'" aria-valuenow="'+Math.round(v)+'"><div class="fill" style="width:'+Math.min(100,pct)+'%;background:'+fill+'"></div></div><div class="t2" style="font-size:12px;color:'+(v>b?'var(--exp)':'var(--muted)')+';margin-top:4px">'+(v>b?'เกินงบ '+money(v-b):'เหลือ '+money(b-v))+'</div></div>';
    }else{
      var p=total>0?v/total*100:0;
      h+='<div class="b"><div class="bh"><span>'+esc(c)+'</span><span class="num">'+money(v)+' · '+Math.round(p)+'%</span></div><div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div></div>';
    }
  });
  return h+'</div>';
}
function yearView(tx,s){
  if(!tx.length)return '<div class="empty">ยังไม่มีรายการในปีนี้ให้สรุป</div>';
  var inc=new Array(12).fill(0),exp=new Array(12).fill(0),byCat={};
  tx.forEach(function(t){var m=+t.date.slice(5,7)-1;if(t.type==='i')inc[m]+=t.amt;else{exp[m]+=t.amt;byCat[t.cat]=(byCat[t.cat]||0)+t.amt;}});
  var now=new Date(),y=+S.month.slice(0,4),months=y===now.getFullYear()?now.getMonth()+1:12;
  var maxM=0;exp.forEach(function(v,i){if(v>exp[maxM])maxM=i;});
  var h='<div class="stats-grid" style="margin-top:16px"><div class="stat"><small>ใช้เฉลี่ยต่อเดือน</small><b class="num">'+money(s.e/months)+'</b></div><div class="stat"><small>เดือนที่ใช้มากสุด</small><b class="num">'+money(exp[maxM])+'</b><small>'+MON[maxM]+'</small></div></div>';
  h+='<h2><span>รายรับ–รายจ่ายรายเดือน</span></h2><div class="card" style="padding:12px">'+yearChart(inc,exp)+'<div class="legend"><span><i style="background:var(--inc)"></i>รายรับ</span><span><i style="background:var(--exp)"></i>รายจ่าย</span></div></div>';
  h+='<h2><span>รายเดือน (แตะเพื่อดูรายการ)</span></h2><div class="list">';
  for(var m=11;m>=0;m--){
    if(!inc[m]&&!exp[m])continue;
    var net=inc[m]-exp[m],key=S.month.slice(0,4)+'-'+pad(m+1);
    h+='<button class="trow" data-act="gomonth" data-m="'+key+'"><span class="m"><div>'+MON[m]+'</div><small class="num">รับ '+money(inc[m])+' · จ่าย '+money(exp[m])+'</small></span><span class="amt num '+(net<0?'e':'i')+'">'+(net<0?'−':'+')+money(Math.abs(net))+'</span></button>';
  }
  h+='</div>';
  if(Object.keys(byCat).length)h+='<h2><span>รายจ่ายแยกตามหมวดทั้งปี</span><span class="num">'+money(s.e)+'</span></h2>'+catBars(byCat,s.e,false);
  return h;
}
function yearChart(inc,exp){
  var W=340,H=150,L=34,B=20,T=10,max=Math.max.apply(null,inc.concat(exp,[1]));
  var step=niceStep(max),top=Math.ceil(max/step)*step,gw=(W-L-4)/12,ch=H-B-T;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน">';
  for(var v=0;v<=top;v+=step){var y=T+ch-(v/top)*ch;svg+='<line class="gridline" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+(v>=1000?(v/1000)+'k':v)+'</text>';}
  for(var i=0;i<12;i++){
    var x=L+i*gw+2,bw=(gw-4)/2,hi=(inc[i]/top)*ch,he=(exp[i]/top)*ch;
    svg+='<rect class="bar inc" x="'+x+'" y="'+(T+ch-hi)+'" width="'+bw+'" height="'+hi+'" rx="2"/><rect class="bar" x="'+(x+bw)+'" y="'+(T+ch-he)+'" width="'+bw+'" height="'+he+'" rx="2"/><text x="'+(x+bw)+'" y="'+(H-6)+'" text-anchor="middle">'+(i+1)+'</text>';
  }
  return svg+'</svg>';
}
function chart(vals,elapsed,avg){
  var W=340,H=150,L=34,B=20,T=10,n=vals.length,max=Math.max.apply(null,vals.concat([avg,1]));
  var step=niceStep(max),top=Math.ceil(max/step)*step;
  var bw=(W-L-4)/n,ch=H-B-T,svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="กราฟรายจ่ายรายวัน">';
  for(var v=0;v<=top;v+=step){var y=T+ch-(v/top)*ch;svg+='<line class="gridline" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+(v>=1000?(v/1000)+'k':v)+'</text>';}
  vals.forEach(function(val,i){var hh=(val/top)*ch,x=L+i*bw+1;svg+='<rect class="bar'+(i>=elapsed?' future':'')+'" x="'+x+'" y="'+(T+ch-hh)+'" width="'+Math.max(1,bw-2)+'" height="'+Math.max(hh,i>=elapsed?1:0)+'" rx="2"/>';if(i===0||(i+1)%7===0)svg+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+(i+1)+'</text>';});
  var ay=T+ch-(avg/top)*ch;svg+='<line class="avg" x1="'+L+'" x2="'+W+'" y1="'+ay+'" y2="'+ay+'"/>';
  return svg+'</svg>';
}
function niceStep(max){var raw=max/3,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

/* ---------- sheets ---------- */

/* แก้ตัวเลขในหน้าหลักทันที: แทนที่ปุ่มด้วยช่องกรอก Enter/แตะที่อื่น = บันทึก, Esc = ยกเลิก พิมพ์สูตรได้ เช่น 450+50 */
function inlineEdit(el,val,allowZero,save){
  var inp=document.createElement('input'),done=false;
  inp.type='text';inp.inputMode='decimal';inp.className='inl num';inp.value=val||'';inp.setAttribute('aria-label','แก้ไขตัวเลข');
  function finish(ok){
    if(done)return;done=true;
    var raw=inp.value.trim(),n=calc(raw);
    if(ok&&raw!==''&&(n>0||(allowZero&&n===0))){save(n);return;}
    if(ok&&raw!=='')toast('ตัวเลขไม่ถูกต้อง');
    render();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();finish(true);}else if(e.key==='Escape')finish(false);});
  inp.addEventListener('blur',function(){finish(true);});
  el.replaceWith(inp);inp.focus();inp.select();
}

/* ปรับยอด: เทียบยอดสะสมทั้งหมดที่บันทึกไว้กับเงินจริง แล้วสร้างรายการ "ปรับยอด" เท่ากับส่วนต่าง */
function adjustSheet(){
  var s=sums(S.txs),bal=Math.round((s.i-s.e)*100)/100;
  function signed(n){return (n<0?'−':'')+money(Math.abs(n));}
  openSheet('<h3>ปรับยอดคงเหลือ</h3><p class="hint">ยอดคงเหลือสะสมจากทุกรายการที่บันทึกไว้: <b class="num">'+signed(bal)+'</b><br>ใส่ยอดเงินจริงที่มีตอนนี้ แอปจะสร้างรายการหมวด "ปรับยอด" เท่ากับส่วนต่างให้ในวันนี้</p><div class="amount"><span>฿</span><input id="f-amt" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="ยอดเงินจริง"></div>'+keypad('f-amt')+'<div class="err" id="err" role="alert"></div><div class="actions"><button type="button" class="btn ghost" id="a-cancel">ยกเลิก</button><button type="button" class="btn" id="a-save">ปรับยอด</button></div>');
  var sh=document.querySelector('.sheet'),err=document.getElementById('err');
  sh.addEventListener('input',function(e){
    if(e.target.id!=='f-amt')return;
    var v=calc(e.target.value),d=Math.round((v-bal)*100)/100;
    err.style.color='var(--muted)';
    err.textContent=isNaN(v)?'':(d===0?'ยอดตรงกันแล้ว':'จะบันทึก'+(d>0?'รายรับ +':'รายจ่าย −')+money(Math.abs(d)));
  });
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='a-cancel')closeSheet();
    else if(b.id==='a-save'){
      var v=calc(document.getElementById('f-amt').value);
      if(isNaN(v)||v<0){err.style.color='';err.textContent='ใส่ยอดเงินจริง (0 ขึ้นไป)';return;}
      var d=Math.round((v-bal)*100)/100;
      if(d===0){closeSheet();toast('ยอดตรงกันแล้ว ไม่ต้องปรับ');return;}
      var today=ymd(new Date());
      S.month=today.slice(0,7);closeSheet();
      saveTx({id:uid(),type:d>0?'i':'e',amt:Math.abs(d),cat:'ปรับยอด',note:'ปรับยอดคงเหลือ',date:today});
      toast('ปรับยอดแล้ว '+(d>0?'+':'−')+money(Math.abs(d)));
    }
  });
}
/* แก้หลายรายการพร้อมกัน: kind = cat | date | del ใช้กับรายการที่เลือกใน S.sel */
function bulkSheet(kind){
  var tx=selTx(),n=tx.length;
  if(!n){toast('ยังไม่ได้เลือกรายการ');return;}
  var body;
  if(kind==='cat'){
    var k=tx[0].type;
    if(tx.some(function(t){return t.type!==k;})){toast('เลือกเฉพาะรายจ่ายหรือรายรับอย่างเดียวก่อนเปลี่ยนหมวด');return;}
    body='<h3>เปลี่ยนหมวด '+n+' รายการ</h3><div class="chips">'+S.cats[k].map(function(c){return '<button type="button" class="chip" data-cat="'+esc(c[0])+'"><i style="background:'+c[1]+'"></i>'+esc(c[0])+'</button>';}).join('')+'</div><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button></div>';
  }else if(kind==='date'){
    body='<h3>เปลี่ยนวันที่ '+n+' รายการ</h3><div class="field one"><div><label for="b-date">วันที่ใหม่</label><input id="b-date" type="date" value="'+ymd(new Date())+'"></div></div><div class="err" id="err" role="alert"></div><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button><button type="button" class="btn" id="b-ok">บันทึก</button></div>';
  }else{
    var s=sums(tx);
    body='<h3>ลบ '+n+' รายการ?</h3><p class="hint">รายรับ '+money(s.i)+' · รายจ่าย '+money(s.e)+' ลบแล้วกู้คืนไม่ได้ (นอกจากนำเข้าจากไฟล์สำรอง)</p><div class="actions"><button type="button" class="btn ghost" id="b-cancel">ยกเลิก</button><button type="button" class="btn danger" style="flex:1" id="b-ok">ลบ '+n+' รายการ</button></div>';
  }
  openSheet(body);
  function finish(msg){S.sel=null;localSave();closeSheet();render();toast(msg);}
  document.querySelector('.sheet').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='b-cancel')closeSheet();
    else if(b.dataset.cat){tx.forEach(function(t){t.cat=b.dataset.cat;});finish('เปลี่ยนหมวด '+n+' รายการแล้ว');}
    else if(b.id==='b-ok'&&kind==='date'){
      var d=document.getElementById('b-date').value;
      if(!d){document.getElementById('err').textContent='เลือกวันที่';return;}
      tx.forEach(function(t){t.date=d;});S.month=d.slice(0,7);finish('เปลี่ยนวันที่ '+n+' รายการแล้ว');
    }
    else if(b.id==='b-ok'){var ids=S.sel;S.txs=S.txs.filter(function(t){return !ids[t.id];});finish('ลบ '+n+' รายการแล้ว');}
  });
}
var PALETTE=['#E2703A','#2F7FD1','#8A5CD6','#D6A21E','#2BA58F','#D6477A','#6F8A2E','#C0392B','#16A085','#7F8C8D'];
function catSheet(){
  function mk(c){return {orig:c[0],name:c[0],color:c[1],b:S.cb[c[0]]||''};}
  var type='e',draft={e:S.cats.e.map(mk),i:S.cats.i.map(mk)};
  openSheet('');
  var sh=document.querySelector('.sheet');
  function read(){
    sh.querySelectorAll('.crow').forEach(function(r){
      var d=draft[type][+r.dataset.i];if(!d)return;
      d.color=r.querySelector('.cc').value;d.name=r.querySelector('.cn').value;
      var b=r.querySelector('.cb');if(b)d.b=b.value;
    });
  }
  function paint(err){
    var rowsH=draft[type].map(function(d,i){
      return '<div class="crow'+(type==='e'?'':' noB')+'" data-i="'+i+'"><input type="color" class="cc" aria-label="สี" value="'+esc(HEX.test(d.color)?d.color:'#7A8A96')+'"><input type="text" class="cn" maxlength="20" aria-label="ชื่อหมวด" value="'+esc(d.name)+'">'+(type==='e'?'<input type="text" class="cb" inputmode="decimal" aria-label="งบต่อเดือน" placeholder="งบ/เดือน" value="'+esc(d.b)+'">':'')+'<button type="button" class="icon-btn del" data-del="'+i+'" aria-label="ลบหมวด">×</button></div>';
    }).join('');
    sh.innerHTML='<h3>หมวดหมู่</h3><div class="seg neutral" style="margin:0 0 12px"><button type="button" data-t="e" aria-pressed="'+(type==='e')+'">รายจ่าย</button><button type="button" data-t="i" aria-pressed="'+(type==='i')+'">รายรับ</button></div>'+(type==='e'?'<p class="hint">ช่องขวาคืองบต่อเดือนของหมวดนั้น เว้นว่างถ้าไม่ต้องการตั้งงบ</p>':'')+rowsH+'<button type="button" class="btn ghost" id="c-add" style="width:100%;margin:4px 0 12px">+ เพิ่มหมวด</button><p class="hint">ถ้าลบหมวด รายการเก่าที่ใช้หมวดนั้นจะยังอยู่ (แสดงเป็นสีเทา) ถ้าเปลี่ยนชื่อ รายการเก่าจะเปลี่ยนตามให้</p><div class="err" id="err" role="alert">'+esc(err||'')+'</div><div class="actions"><button type="button" class="btn ghost" id="c-cancel">ยกเลิก</button><button type="button" class="btn" id="c-save">บันทึก</button></div>';
  }
  function apply(){
    var res={},msg='';
    var ok=['e','i'].every(function(k){
      var seen={},arr=[],where=' (แท็บ'+(k==='e'?'รายจ่าย':'รายรับ')+')';
      for(var j=0;j<draft[k].length;j++){
        var d=draft[k][j],n=d.name.trim();
        if(!n){msg='ตั้งชื่อหมวดให้ครบ'+where;return false;}
        if(seen[n]){msg='ชื่อหมวด "'+n+'" ซ้ำ'+where;return false;}
        seen[n]=1;arr.push({orig:d.orig,name:n,color:HEX.test(d.color)?d.color:'#7A8A96',b:calc(d.b)||0});
      }
      res[k]=arr;return true;
    });
    if(!ok)return msg;
    ['e','i'].forEach(function(k){
      var ren={};res[k].forEach(function(d){if(d.orig&&d.orig!==d.name)ren[d.orig]=d.name;});
      function fix(x){if(x.type===k&&Object.prototype.hasOwnProperty.call(ren,x.cat))x.cat=ren[x.cat];}
      S.txs.forEach(fix);S.rec.forEach(fix);
      S.cats[k]=res[k].map(function(d){return [d.name,d.color];});
    });
    S.cb={};res.e.forEach(function(d){if(d.b>0)S.cb[d.name]=d.b;});
    localSave();
    return '';
  }
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.t){read();type=b.dataset.t;paint();}
    else if(b.dataset.del!==undefined){
      read();
      if(draft[type].length<=1){paint('ต้องมีอย่างน้อย 1 หมวด');return;}
      draft[type].splice(+b.dataset.del,1);paint();
    }
    else if(b.id==='c-add'){read();draft[type].push({orig:'',name:'',color:PALETTE[draft[type].length%PALETTE.length],b:''});paint();var ins=sh.querySelectorAll('.cn');ins[ins.length-1].focus();}
    else if(b.id==='c-cancel')closeSheet();
    else if(b.id==='c-save'){read();var msg=apply();if(msg)paint(msg);else{closeSheet();render();toast('บันทึกหมวดหมู่แล้ว');}}
  });
  paint();
}

document.addEventListener('change',function(e){
  if(e.target.id!=='s-file'||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.txs))throw 0;
    var ids={};S.txs.forEach(function(t){ids[t.id]=1;});var n=0;
    d.txs.forEach(function(t){if(t&&t.id&&t.date&&t.amt>0&&(t.type==='i'||t.type==='e')&&!ids[t.id]){var x={id:String(t.id),type:t.type,amt:+t.amt,cat:String(t.cat||'อื่นๆ'),note:String(t.note||''),date:String(t.date)};if(t.rid)x.rid=String(t.rid);S.txs.push(x);n++;}});
    if(!S.budget&&d.budget>0)S.budget=+d.budget;
    if(d.cats&&typeof d.cats==='object')['e','i'].forEach(function(k){(cleanCats(d.cats[k])||[]).forEach(function(c){if(!S.cats[k].some(function(x){return x[0]===c[0];}))S.cats[k].push(c);});});
    var cb=cleanCb(d.cb);Object.keys(cb).forEach(function(k){if(!S.cb[k])S.cb[k]=cb[k];});
    var rids={};S.rec.forEach(function(r){rids[r.id]=1;});cleanRec(d.rec).forEach(function(r){if(!rids[r.id])S.rec.push(r);});
    localSave();closeSheet();render();toast('นำเข้า '+n+' รายการ');
  }catch(x){toast('ไฟล์สำรองไม่ถูกต้อง');}};r.readAsText(e.target.files[0]);
});
function exportCsv(){
  var rowsOut=S.txs.slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(t){return [t.date,t.type==='i'?'รายรับ':'รายจ่าย',t.cat,t.amt,'"'+(t.note||'').replace(/"/g,'""')+'"'].join(',');});
  if(!rowsOut.length){toast('ยังไม่มีข้อมูลให้ส่งออก');return;}
  var csv='﻿วันที่,ประเภท,หมวด,จำนวนเงิน,โน้ต\n'+rowsOut.join('\n');
  function fallback(){openSheet('<h3>ส่งออก CSV</h3><p style="font-size:13px;color:var(--muted);margin-bottom:8px">คัดลอกข้อความนี้ไปวางใน Excel หรือ Google Sheets</p><textarea id="csv" readonly>'+esc(csv)+'</textarea><div class="actions"><button type="button" class="btn ghost" id="c-close">ปิด</button><button type="button" class="btn" id="c-copy">คัดลอก</button></div>');
    document.querySelector('.sheet').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='c-close')closeSheet();if(b.id==='c-copy'){var ta=document.getElementById('csv');ta.select();try{navigator.clipboard.writeText(csv).then(function(){toast('คัดลอกแล้ว');},function(){document.execCommand&&document.execCommand('copy');});}catch(x){}}});}
  if(true){saveFile('รายรับรายจ่าย-'+ymd(new Date())+'.csv',csv,'text/csv;charset=utf-8');toast('ส่งออกแล้ว');closeSheet();}
  else fallback();
}

/* ---------- events ---------- */
document.getElementById('fab').addEventListener('click',function(){entrySheet();});
document.getElementById('tab-home').addEventListener('click',function(){S.tab='home';render();});
document.getElementById('tab-stats').addEventListener('click',function(){S.tab='stats';render();});
document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=b.dataset.act,t;
  if(a==='prev'||a==='next'){var p=S.month.split('-'),step=(yearMode()?12:1)*(a==='next'?1:-1),d=new Date(+p[0],+p[1]-1+step,1);S.month=ym(d);render();}
  else if(a==='settings')settingsSheet();
  else if(a==='sm-m'||a==='sm-y'){S.sm=a==='sm-y'?'y':'m';render();}
  else if(a==='gomonth'){S.month=b.dataset.m;S.tab='home';render();}
  else if(a==='adjust')adjustSheet();
  else if(a==='edit-budget')inlineEdit(b,S.budget||'',true,saveBudget);
  else if(a==='sel'){S.sel=S.sel?null:{};render();}
  else if(a==='sel-all'){var vis=filtered(),all=vis.length&&vis.every(function(x){return S.sel[x.id];});S.sel={};if(!all)vis.forEach(function(x){S.sel[x.id]=1;});renderList();}
  else if(a==='sel-cat'||a==='sel-date'||a==='sel-del')bulkSheet(a.slice(4));
  else if(b.dataset.amt){t=S.txs.find(function(x){return x.id===b.dataset.amt;});if(t)inlineEdit(b,t.amt,false,function(n){t.amt=n;saveTx(t);});}
  else if(b.dataset.id&&!isDemo()){
    if(S.sel){if(S.sel[b.dataset.id])delete S.sel[b.dataset.id];else S.sel[b.dataset.id]=1;renderList();}
    else{t=S.txs.find(function(x){return x.id===b.dataset.id;});if(t)entrySheet(t);}
  }
});
document.getElementById('app').addEventListener('input',function(e){if(e.target.id==='f-q'){S.q=e.target.value;renderList();}});
document.getElementById('app').addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-type')S.fType=e.target.value;
  else if(id==='f-cat')S.fCat=e.target.value;
  else if(id==='f-all')S.fAll=e.target.checked;
  else return;
  renderList();
});
initStore();
render();
})();
</script>
</body>
