<style>
/* Layout idea: single-column phone ledger. Summary card on top, day-grouped list, bottom tabs, sheet for entry. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#12212A; --muted:#5E727D; --line:#D9E1E5;
  --accent:#2446C4; --accent-ink:#FFFFFF; --inc:#12805A; --exp:#C73B2E; --inc-bg:#DFF3EA; --exp-bg:#FBE4E1;
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E171C; --surface:#16232A; --ink:#E7EEF1; --muted:#90A4AE; --line:#27373F;
    --accent:#7C95FF; --accent-ink:#0E171C; --inc:#4CCB98; --exp:#FF8A7D; --inc-bg:#12372B; --exp-bg:#3E1E1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#16232A; --ink:#E7EEF1; --muted:#90A4AE; --line:#27373F;
  --accent:#7C95FF; --accent-ink:#0E171C; --inc:#4CCB98; --exp:#FF8A7D; --inc-bg:#12372B; --exp-bg:#3E1E1B;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:12px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:18px;font-weight:600;min-width:140px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.icon-btn:hover{background:var(--surface)}
.card{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.bal-label{color:var(--muted);font-size:13px}
.bal{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.bal.neg{color:var(--exp)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pill{border-radius:14px;padding:10px 12px}
.pill small{display:block;font-size:12px;color:var(--muted)}
.pill b{font-size:18px;font-weight:600}
.pill.inc{background:var(--inc-bg)} .pill.inc b{color:var(--inc)}
.pill.exp{background:var(--exp-bg)} .pill.exp b{color:var(--exp)}
.budget{margin-top:14px}
.budget .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;gap:8px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.fill.warn{background:#D6A21E} .fill.over{background:var(--exp)}
.link{color:var(--accent);font-weight:500;font-size:13px;padding:4px 0}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.banner.bak{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;border-style:solid;border-color:var(--accent)}
.bakacts{display:flex;gap:14px;flex:none}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.day{margin-top:14px}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.dot{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--muted)}
.amt{font-weight:600}
.amt.i{color:var(--inc)} .amt.e{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
.bars .b{margin-bottom:12px}
.bars .bh{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.bars .bh span:last-child{color:var(--muted)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:18px;font-weight:600}
svg text{fill:var(--muted);font-family:var(--font);font-size:10px}
.gridline{stroke:var(--line);stroke-width:1}
.bar{fill:var(--exp)} .bar.future{fill:var(--line)}
.avg{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center}
nav .tab{padding:8px;font-size:13px;color:var(--muted);font-weight:500;border-radius:12px}
nav .tab[aria-current="page"]{color:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;margin:-26px auto 0;box-shadow:0 6px 18px rgba(36,70,196,.35);display:grid;place-items:center}
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:9px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].e{background:var(--exp);color:#fff}
.seg button[aria-pressed="true"].i{background:var(--inc);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E171C}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E171C}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.amount span{font-size:26px;color:var(--muted)}
.amount input{border:0;background:none;font-size:38px;font-weight:700;width:100%;outline:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--bg);font-weight:600}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.field.one{grid-template-columns:1fr}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.actions{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{flex:none;background:var(--exp-bg);color:var(--exp);padding:13px 18px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:-6px 0 8px}
textarea{width:100%;height:140px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:12px;margin-bottom:12px}
.filters{margin-top:14px}
.filters input[type=search],.filters select,.crow input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fopt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.result{font-size:12px;color:var(--muted);margin:10px 4px 0;display:flex;justify-content:space-between;gap:8px}
.seg.neutral{margin:14px 0 0}
.seg.neutral button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar.inc{fill:var(--inc)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.crow{display:grid;grid-template-columns:40px 1fr 90px 36px;gap:8px;align-items:center;margin-bottom:8px}
.crow.noB{grid-template-columns:40px 1fr 36px}
.crow input[type=color]{width:40px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.crow .del{width:36px;height:36px;color:var(--exp);font-size:22px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.trow{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;text-align:left}
.trow+.trow{border-top:1px solid var(--line)}
.trow .m{flex:1}
.trow small{color:var(--muted);font-size:12px}
.txmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.amt-btn{padding:6px 8px;margin:-6px -8px;border-radius:8px}
.amt-btn:hover,.bud-btn:hover{background:var(--bg)}
.bud-btn{border-radius:6px;text-decoration:underline dotted;text-underline-offset:3px}
.inl{width:120px;padding:6px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--bg);text-align:right;font-weight:600}
button.bal{display:block;text-align:left;border-radius:8px}
.calc-out{min-height:20px;font-size:13px;color:var(--muted);margin:-8px 0 8px;text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.key{padding:6px 0;border-radius:12px;background:var(--bg);font-size:18px;font-weight:600}
.key.op{color:var(--accent)}
.key:active{background:var(--line)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.selbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;font-size:13px}
.selbtn .ico{width:16px;height:16px}
.selbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selbar{position:sticky;top:8px;z-index:4;margin-top:12px;padding:10px 10px 8px;border-radius:16px;background:#16232A;color:#E7EEF1;border:1px solid #2C3F49;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px}
.selhead{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-weight:600}
.selhead .badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#7C95FF;color:#0E171C;display:inline-grid;place-items:center;font-size:13px}
.selhead small{margin-left:auto;font-weight:400;opacity:.7;font-size:12px}
.selacts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.selacts button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;color:#E7EEF1;font-size:12px;font-weight:600;background:rgba(255,255,255,.08)}
.selacts button:active{background:rgba(255,255,255,.18)}
.selacts button.off{opacity:.4}
.selacts button.del{background:#FF8A7D;color:#0E171C}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:var(--accent-ink);transition:background .12s,border-color .12s}
.cb .ico{width:14px;height:14px;stroke-width:3}
.cb.on{background:var(--accent);border-color:var(--accent)}
.tx.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.amt.x{color:var(--muted)}
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.acc:hover{border-color:var(--accent)}
.accn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.accn i{width:8px;height:8px;border-radius:50%;flex:none}
.acc b{display:block;font-size:16px;font-weight:600;margin-top:2px}
.acc b.neg{color:var(--exp)}
.accact{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.seg2{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg2 button{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dd{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.dd>div{flex:1;text-align:center;font-size:14px}
.dd small{display:block;color:var(--muted);font-size:12px}
.dbar{fill:var(--exp);opacity:.55}
.dbar.sel{opacity:1}
.dbar.future,.dbar.zero{fill:var(--line);opacity:1}
.dbar.sel.zero{fill:var(--muted)}
svg text.alab{font-size:10px;fill:var(--muted)}
svg text.alab.bad{fill:var(--exp)}
svg text.vlab{font-size:10px;fill:var(--muted)}
svg text.vlab.on{fill:var(--ink);font-weight:600}
svg text.xsel{fill:var(--accent);font-weight:700}
svg text.today{fill:var(--ink);font-weight:600}
.cline{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--accent);opacity:.14}
.proj{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 4;opacity:.7}
.budl{stroke:var(--exp);stroke-width:1.5;stroke-dasharray:5 3}
.pace{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round}
.selv{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.dotc{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.stack{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin-bottom:10px}
.stack i{display:block;height:100%;min-width:2px}
.catrow{display:block;width:100%;text-align:left;padding:10px 0}
.catrow+.catrow{border-top:1px solid var(--line)}
.catrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:6px}
.catrow small{color:var(--muted);font-size:12px}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dl{font-size:12px;font-weight:600;color:var(--muted)}
.dl.bad{color:var(--exp)}
.dl.good{color:var(--inc)}
.stat b .dl{font-size:18px}
.wk{display:flex;gap:8px;align-items:flex-end;height:104px}
.wk .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.wk .c i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--exp);opacity:.45}
.wk .c.max i{opacity:1}
.wk .c small,.wk .c span{font-size:11px;color:var(--muted)}
.ci{display:inline-grid;place-items:center;color:#fff;line-height:0;--n:0}
.ci svg{width:22px;height:22px;display:block;overflow:visible}
.dot .ci svg{width:23px;height:23px}
.ci.mini{width:22px;height:22px;border-radius:50%;flex:none}
.accact .link .ico{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.ci.mini svg{width:15px;height:15px}
.catrow .ci.mini{width:20px;height:20px;margin-right:6px;vertical-align:-5px}
.chip .ci.mini{margin-left:-3px}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width .3s}
  /* ไอคอนหมวด: ขยับเมื่อแตะ/วางเมาส์/เลือก (วนไม่จำกัด) เด้งครั้งเดียวตอนเข้าหน้า และเต้น 3 รอบเมื่อเพิ่งบันทึก */
  #app.enter .ci{--n:1}
  :is(.tx:hover,.tx:active,.trow:hover,.trow:active,.catrow:hover,.catrow:active,.chip:hover,.chip[aria-pressed="true"]) .ci{--n:infinite}
  .tx.flash .ci{--n:3}
  .ci svg *{transform-box:fill-box}
  @keyframes steam{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.25;transform:translateY(-1.8px)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-1.6px)}70%{transform:translateY(.4px)}}
  @keyframes drive{0%,100%{transform:translate(0,0)}25%{transform:translate(.8px,-.7px)}75%{transform:translate(-.8px,-.7px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.93)}}
  @keyframes puff{0%,100%{opacity:0;transform:translateY(1px) scale(.6)}50%{opacity:1;transform:translateY(-1px) scale(1)}}
  @keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.16)}40%{transform:scale(.96)}60%{transform:scale(1.1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.14) rotate(14deg)}}
  .ci .a-steam path{animation:steam 1.2s ease-in-out var(--n)}
  .ci .a-steam path:nth-child(2){animation-delay:.2s}.ci .a-steam path:nth-child(3){animation-delay:.4s}
  .ci .a-bowl{transform-origin:50% 100%;animation:bounce .7s ease-in-out var(--n)}
  .ci .a-bus{animation:drive .5s ease-in-out var(--n)}
  .ci .a-wheel{transform-origin:center;animation:spin .6s linear var(--n)}
  .ci .a-handle{transform-origin:50% 100%;animation:swing .8s ease-in-out var(--n)}
  .ci .a-bag{transform-origin:50% 100%;animation:bounce .8s ease-in-out var(--n)}
  .ci .a-house{transform-origin:50% 100%;animation:squish .9s ease-in-out var(--n)}
  .ci .a-heart2{animation:puff .9s ease-in-out var(--n)}
  .ci .a-cap{transform-origin:50% 60%;animation:bounce .8s ease-in-out var(--n)}
  .ci .a-tassel{transform-origin:50% 0;animation:swing .8s ease-in-out var(--n)}
  .ci .a-beat{transform-origin:center;animation:beat .9s ease-in-out var(--n)}
  .ci .a-game{transform-origin:center;animation:wiggle .6s ease-in-out var(--n)}
  .ci .a-btn1{animation:blink .6s ease-in-out var(--n)}.ci .a-btn2{animation:blink .6s ease-in-out .3s var(--n)}
  .ci .a-star{transform-origin:center;animation:twinkle 1s ease-in-out var(--n)}
  .ci .a-sp1{animation:blink .8s ease-in-out var(--n)}.ci .a-sp2{animation:blink .8s ease-in-out .4s var(--n)}
  @keyframes coindrop{0%{transform:translateY(-2.5px);opacity:0}25%{opacity:1}70%{transform:translateY(3.6px);opacity:1}100%{transform:translateY(4.6px);opacity:0}}
  @keyframes slidea{0%,100%{transform:translateX(0)}50%{transform:translateX(2.4px)}}
  @keyframes slideb{0%,100%{transform:translateX(0)}50%{transform:translateX(-2.4px)}}
  .ci .a-coin{animation:coindrop 1.1s ease-in var(--n)}
  .ci .a-pig{transform-origin:50% 100%;animation:bounce .9s ease-in-out .35s var(--n)}
  .ci .a-arr1{animation:slidea .8s ease-in-out var(--n)}
  .ci .a-arr2{animation:slideb .8s ease-in-out var(--n)}
  @keyframes bargrow{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.55)}}
  .ci .a-env{transform-origin:50% 100%;animation:bounce .8s ease-in-out var(--n)}
  .ci .a-hrt{transform-origin:center;animation:beat .9s ease-in-out var(--n)}
  .ci .a-sack{transform-origin:50% 100%;animation:wiggle .7s ease-in-out var(--n)}
  .ci .a-bar1,.ci .a-bar2,.ci .a-bar3{transform-origin:50% 100%;animation:bargrow .9s ease-in-out var(--n)}
  .ci .a-bar2{animation-delay:.12s}.ci .a-bar3{animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  @keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  @keyframes flash{0%{background:color-mix(in srgb,var(--accent) 30%,transparent)}100%{background:transparent}}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  /* เปิดหน้า / เปลี่ยนเดือน-ปี-แท็บ: ส่วนต่าง ๆ ไล่ขึ้นมาทีละชั้น */
  #app.enter>*{animation:rise .4s cubic-bezier(.22,1,.36,1) both}
  #app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}
  #app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}
  #app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
  #app.enter .day{animation:rise .42s cubic-bezier(.22,1,.36,1) both}
  #app.enter .day:nth-child(2){animation-delay:.1s}#app.enter .day:nth-child(3){animation-delay:.15s}
  #app.enter .day:nth-child(4){animation-delay:.2s}#app.enter .day:nth-child(n+5){animation-delay:.25s}
  #app.enter .fill,#app.enter .stack i{transform-origin:left;animation:growx .7s cubic-bezier(.22,1,.36,1) .15s both}
  #app.enter .dbar,#app.enter .bar{transform-box:fill-box;transform-origin:bottom;animation:growy .55s cubic-bezier(.22,1,.36,1) .1s both}
  #app.enter .cline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out .1s forwards}
  #app.enter .area{animation:fadein .8s ease-out .3s both}
  /* แผ่นล่างเลื่อนขึ้น ฉากหลังจางเข้า */
  .scrim{animation:fadein .2s ease-out}
  .sheet{animation:sheetup .3s cubic-bezier(.22,1,.36,1)}
  .toast{animation:toastin .26s cubic-bezier(.22,1,.36,1)}
  /* ตอบสนองการกด */
  .btn,.chip,.fab,.icon-btn,.selbtn,.selacts button,.seg button,nav .tab,.key,.link,.amt-btn,.bal{transition:transform .12s ease,background-color .18s ease,color .18s ease,border-color .18s ease,opacity .18s ease}
  .btn:active,.chip:active,.fab:active,.icon-btn:active,.selbtn:active,.selacts button:active,.seg button:active,nav .tab:active,.key:active{transform:scale(.94)}
  .txmain:active{opacity:.6}
  .cb.on{animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
  .tx.flash{animation:flash 1.1s ease-out}
}

/* ---------- ล็อกแอป (PIN / ลายนิ้วมือ) ---------- */
#lockscr{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
html.locked #lockscr{display:flex}
html.locked body{overflow:hidden}
html.locked #app,html.locked nav{visibility:hidden}
:root[data-theme="space"] #lockscr{background:radial-gradient(120% 80% at 50% -10%,#1C2468,#0B1030 48%,#050818)}
.pin-box{width:100%;max-width:320px;text-align:center}
.pin-t{font-size:20px;font-weight:700;margin-bottom:4px}
.pin-s{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:18px}
.pin-s.bad{color:var(--exp)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);display:block}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.pin-pad button{height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:600}
.pin-pad button:active{background:var(--line)}
.pin-pad .ghostk{background:none;border-color:transparent;font-size:20px;color:var(--muted)}
.pin-pad .ico{width:26px;height:26px;margin:auto;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pin-link{margin-top:18px}
@media (prefers-reduced-motion:no-preference){
  @keyframes pinshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  .pin-dots.shake{animation:pinshake .4s}
}

/* ---------- เป้าหมายออม ---------- */
.goals{margin-top:12px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px;padding:0 4px}
.goal{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:8px}
.goal .gtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:10px}
.goal .gtop span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.gtrack{position:relative;height:8px;border-radius:99px;background:var(--line)}
.gfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#5FD3FF)}
.goal.done .gfill{background:var(--inc)}
.grocket{position:absolute;top:-2px;width:20px;height:12px;overflow:visible;left:clamp(0px,calc(var(--p) * 1% - 10px),calc(100% - 20px))}
@media (prefers-reduced-motion:no-preference){
  @keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes gflame{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}
  .grocket{animation:gbob 1.6s ease-in-out infinite}
  .grocket .gfl{transform-box:fill-box;transform-origin:right center;animation:gflame .25s ease-in-out infinite}
  #app.enter .gfill{transform-origin:left;animation:growx .7s cubic-bezier(.22,1,.36,1) .15s both}
}

/* ---------- บันทึกด่วน / แจ้งเตือนงบ / เอฟเฟกต์ตอนบันทึก ---------- */
.chip.qk{padding:7px 10px}
.chip.qk b{font-weight:600}
.fab{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.bhint{margin-top:8px;font-size:12px;font-weight:600}
.bhint.warn{color:#D6A21E}
.bhint.over{color:var(--exp)}
#fx{position:fixed;left:0;top:0;width:0;height:0;z-index:60;pointer-events:none}
#fx i{position:absolute;left:0;top:0;width:var(--s,8px);height:var(--s,8px);margin:calc(var(--s,8px)/-2) 0 0 calc(var(--s,8px)/-2);border-radius:50%;background:var(--c);opacity:0;animation:fxout var(--t,.9s) cubic-bezier(.15,.7,.3,1) forwards}
#fx i.star{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes fxout{0%{opacity:1;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r))}}

/* ---------- ธีมสี: ดำสนิท / ทะเล / ซากุระ + การ์ดตัวอย่างในหน้าตั้งค่า ---------- */
:root[data-theme="black"]{
  --bg:#000000; --surface:#0D0D10; --ink:#F2F2F5; --muted:#8F8F99; --line:#25252B;
  --accent:#7C95FF; --accent-ink:#000000; --inc:#4CCB98; --exp:#FF8A7D; --inc-bg:#0C2A20; --exp-bg:#2D1512;
  color-scheme:dark;
}
:root[data-theme="ocean"]{
  --bg:#06161C; --surface:#0C2530; --ink:#E3F6F7; --muted:#86B1B8; --line:#17404B;
  --accent:#4FD1C5; --accent-ink:#04141A; --inc:#5DEBB6; --exp:#FF9A8B; --inc-bg:#0F3A33; --exp-bg:#3A2020;
  color-scheme:dark;
}
:root[data-theme="sakura"]{
  --bg:#FFF1F4; --surface:#FFFFFF; --ink:#3A1F2B; --muted:#8A6574; --line:#F2D6DE;
  --accent:#D6457A; --accent-ink:#FFFFFF; --inc:#12805A; --exp:#C73B2E; --inc-bg:#DFF3EA; --exp-bg:#FBE4E1;
  color-scheme:light;
}
:root:is([data-theme="black"],[data-theme="ocean"]) .seg button[aria-pressed="true"]{color:#04141A}
:root[data-theme="black"] .scrim{background:rgba(0,0,0,.7)}
:root[data-theme="sakura"] .fab{box-shadow:0 6px 18px rgba(214,69,122,.35)}
:root[data-theme="ocean"] .fab{box-shadow:0 6px 18px rgba(79,209,197,.3)}
.thms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thm{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 6px 8px;border-radius:14px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink)}
.thm[aria-pressed="true"]{border-color:var(--accent);background:var(--bg);font-weight:700;box-shadow:0 0 0 1px var(--accent)}
.thm .sw{position:relative;width:100%;height:46px;border-radius:9px;overflow:hidden;border:1px solid rgba(128,128,128,.28)}
.thm .sw i{position:absolute;left:8px;right:8px;top:8px;height:16px;border-radius:5px}
.thm .sw b{position:absolute;left:8px;width:42%;bottom:7px;height:6px;border-radius:3px}
.thm .sw u{position:absolute;right:8px;bottom:5px;width:12px;height:10px;border-radius:50%;background:#fff;opacity:.9}

   รายการเก่าที่ไม่มี acc ถือว่าอยู่บัญชีแรก */
function defAccts(){return [{id:'bank',name:'ธนาคาร',color:'#2F7FD1'},{id:'tmw',name:'ทรูมันนี่วอลเลท',color:'#E2703A'},{id:'cash',name:'เงินสด',color:'#2BA58F'}];}
function accById(id){for(var i=0;i<S.accts.length;i++)if(S.accts[i].id===id)return S.accts[i];return null;}
function accOf(t){return accById(t.acc)?t.acc:S.accts[0].id;}
function accName(id){var a=accById(id);return a?a.name:S.accts[0].name;}
function defAcc(){return accById(S.lastAcc)?S.lastAcc:S.accts[0].id;}
function accBalances(){
  var b={};S.accts.forEach(function(a){b[a.id]=0;});
  S.txs.forEach(function(t){
    var f=accOf(t);
    if(t.type==='i')b[f]+=t.amt;
    else if(t.type==='e')b[f]-=t.amt;
    else if(t.type==='x'){b[f]-=t.amt;if(accById(t.to))b[t.to]+=t.amt;}
  });
  return b;
}
function subline(t){return t.type==='x'?accName(accOf(t))+' → '+accName(t.to):t.cat+' · '+accName(accOf(t));}
function accChipsHtml(sel,attr){return S.accts.map(function(a){return '<button type="button" class="chip" data-'+attr+'="'+esc(a.id)+'" aria-pressed="'+(sel===a.id)+'"><i style="background:'+a.color+'"></i>'+esc(a.name)+'</button>';}).join('');}

function pad(n){return n<10?'0'+n:''+n;}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function ymd(d){return ym(d)+'-'+pad(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var NF=new Intl.NumberFormat('th-TH',{maximumFractionDigits:2});
function money(n){return '฿'+NF.format(Math.round(n*100)/100);}
function dateOf(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function monthLabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function dayLabel(s){
  var d=dateOf(s),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(s===ymd(t))return 'วันนี้';
  if(s===ymd(y))return 'เมื่อวาน';
  var o={weekday:'short',day:'numeric',month:'short'};
  if(d.getFullYear()!==t.getFullYear())o.year='numeric';
  return d.toLocaleDateString('th-TH',o);
}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function list(){return S.txs;}

/* ---------- storage ---------- */
var HEX=/^#[0-9a-fA-F]{6}$/;
function cleanCats(a){
  if(!Array.isArray(a))return null;
  var out=[],seen={};
  a.forEach(function(c){if(Array.isArray(c)&&typeof c[0]==='string'&&c[0].trim()&&!seen[c[0].trim()]){var n=c[0].trim().slice(0,20);seen[n]=1;out.push([n,HEX.test(c[1])?c[1]:'#7A8A96']);}});
  return out.length?out:null;
}
function cleanCb(o){var out={};if(o&&typeof o==='object')Object.keys(o).forEach(function(k){var v=+o[k];if(v>0&&isFinite(v))out[k]=v;});return out;}
function cleanRec(a){
  var out=[];
  if(Array.isArray(a))a.forEach(function(r){
    if(r&&r.id&&(r.type==='i'||r.type==='e')&&r.amt>0&&r.day>=1&&r.day<=31&&/^\d{4}-\d{2}$/.test(r.start))
      out.push({id:String(r.id),type:r.type,amt:+r.amt,cat:String(r.cat||'อื่นๆ'),acc:String(r.acc||''),note:String(r.note||''),day:Math.floor(r.day),start:r.start,done:/^\d{4}-\d{2}$/.test(r.done)?r.done:''});
  });
  return out;
}
function cleanAccts(a){
  if(!Array.isArray(a))return null;
  var out=[],seen={};
  a.forEach(function(x){if(x&&typeof x.id==='string'&&x.id&&typeof x.name==='string'&&x.name.trim()&&!seen[x.id]){seen[x.id]=1;out.push({id:x.id,name:x.name.trim().slice(0,20),color:HEX.test(x.color)?x.color:'#7A8A96'});}});
  return out.length?out:null;
}
/* ความปลอดภัยของข้อมูลเมื่ออัปเดตแอป: ก่อนใช้ข้อมูลเวอร์ชันเก่าครั้งแรก เก็บสำเนาดิบของทุกคีย์ rr_* ไว้ใน rr_bak_v<เวอร์ชัน> (ทำครั้งเดียว ไม่เขียนทับ)
   และถ้าข้อมูลหลักอ่านไม่ได้ จะเก็บสำเนาไว้ก่อนเสมอ เพื่อไม่ให้การบันทึกครั้งถัดไปทับข้อมูลเดิมจนหาย */
var DATA_VER='3';
function snapshotOld(){
  try{
    if(localStorage.getItem('rr_ver')===DATA_VER||localStorage.getItem('rr_tx')===null)return;
    var k='rr_bak_v'+DATA_VER;if(localStorage.getItem(k)!==null)return;
    var snap={};Object.keys(localStorage).forEach(function(n){if(n.indexOf('rr_')===0&&n.indexOf('rr_bak')!==0)snap[n]=localStorage.getItem(n);});
    localStorage.setItem(k,JSON.stringify(snap));
  }catch(e){}
}
function localLoad(){
  snapshotOld();
  try{S.txs=JSON.parse(localStorage.getItem('rr_tx')||'[]');S.budget=+localStorage.getItem('rr_budget')||0;if(!Array.isArray(S.txs))throw 0;}
  catch(e){
    S.txs=[];
    try{if(localStorage.getItem('rr_bak_corrupt')===null)localStorage.setItem('rr_bak_corrupt',localStorage.getItem('rr_tx')||'');}catch(x){}
  }
  try{
    var c=JSON.parse(localStorage.getItem('rr_cats')||'null');
    if(c){S.cats={e:cleanCats(c.e)||copyCats(EXP),i:cleanCats(c.i)||copyCats(INC)};}
    S.cb=cleanCb(JSON.parse(localStorage.getItem('rr_cb')||'{}'));
    S.rec=cleanRec(JSON.parse(localStorage.getItem('rr_rec')||'[]'));
    S.accts=cleanAccts(JSON.parse(localStorage.getItem('rr_accts')||'null'))||defAccts();
    S.lastAcc=localStorage.getItem('rr_lastacc')||'';
    S.goals=cleanGoals(JSON.parse(localStorage.getItem('rr_goals')||'[]'));
  }catch(e){}
}
function localSave(){
  try{
    localStorage.setItem('rr_tx',JSON.stringify(S.txs));localStorage.setItem('rr_budget',String(S.budget));
    localStorage.setItem('rr_cats',JSON.stringify(S.cats));localStorage.setItem('rr_cb',JSON.stringify(S.cb));localStorage.setItem('rr_rec',JSON.stringify(S.rec));localStorage.setItem('rr_accts',JSON.stringify(S.accts));localStorage.setItem('rr_lastacc',S.lastAcc);localStorage.setItem('rr_goals',JSON.stringify(S.goals));localStorage.setItem('rr_ver',DATA_VER);
  }catch(e){toast('บันทึกไม่สำเร็จ พื้นที่อาจเต็ม');}
}
/* สร้างรายการจากรายการประจำ: เดือนที่ยังไม่สร้างจนถึงเดือนนี้ (เฉพาะวันที่ที่ถึงแล้ว) คืนจำนวนที่สร้าง */
function nextYm(m){var p=m.split('-');return ym(new Date(+p[0],+p[1],1));}
function genRecurring(){
  var today=ymd(new Date()),cur=today.slice(0,7),n=0;
  S.rec.forEach(function(r){
    var m=r.done?nextYm(r.done):r.start;
    while(m<=cur){
      var date=m+'-'+pad(Math.min(r.day,daysIn(m)));
      if(date>today)break;
      S.txs.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,note:r.note,date:date,rid:r.id,acc:r.acc});
      r.done=m;n++;m=nextYm(m);
    }
  });
  if(n)localSave();
  return n;
}
/* ลบรายการประจำแบบกู้คืนได้ (รายการที่สร้างไปแล้วไม่ถูกแตะ จึงไม่ซ้ำเมื่อกู้คืน) */
function undoableDelRec(id){
  var k=S.rec.findIndex(function(x){return x.id===id;});
  if(k<0){recSheet();return;}
  var r=S.rec[k];delRec(id);recSheet();
  toast('ลบรายการประจำแล้ว','กู้คืน',function(){
    if(!S.rec.some(function(x){return x.id===r.id;})){S.rec.splice(Math.min(k,S.rec.length),0,r);localSave();}
    var h=document.querySelector('.sheet h3');
    if(h&&h.textContent==='รายการประจำ')recSheet();
    toast('กู้คืนรายการประจำแล้ว');
  });
}
function saveRec(r){var k=S.rec.findIndex(function(x){return x.id===r.id;});if(k>=0)S.rec[k]=r;else S.rec.push(r);localSave();}
function delRec(id){S.rec=S.rec.filter(function(x){return x.id!==id;});localSave();}

/* ---------- เครื่องคิดเลข: คำนวณ + − × ÷ โดยไม่ใช้ eval คืน NaN ถ้ารูปแบบผิด ---------- */
function calc(s){
  s=String(s==null?'':s).replace(/[,\s]/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  var tok=s.match(/\d+\.?\d*|\.\d+|[+\-*\/]/g);
  if(!tok||tok.join('')!==s)return NaN;
  while(tok.length&&/^[+\-*\/]$/.test(tok[tok.length-1]))tok.pop();
  var nums=[],ops=[],want=true,sign=1,i;
  for(i=0;i<tok.length;i++){
    var t=tok[i],isOp=/^[+\-*\/]$/.test(t);
    if(want){
      if(t==='-'){sign=-sign;continue;}
      if(t==='+')continue;
      if(isOp)return NaN;
      nums.push(sign*parseFloat(t));sign=1;want=false;
    }else{
      if(!isOp)return NaN;
      ops.push(t);want=true;
    }
  }
  if(want||!nums.length)return NaN;
  var n2=[nums[0]],o2=[];
  for(i=0;i<ops.length;i++){
    if(ops[i]==='*')n2[n2.length-1]*=nums[i+1];
    else if(ops[i]==='/')n2[n2.length-1]/=nums[i+1];
    else{o2.push(ops[i]);n2.push(nums[i+1]);}
  }
  var r=n2[0];
  for(i=0;i<o2.length;i++)r=o2[i]==='+'?r+n2[i+1]:r-n2[i+1];
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
var KEYS=['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'],OPS=/[÷×−+]/;
function keypad(target){return '<div class="calc-out num" data-for="'+target+'"></div><div class="pad">'+KEYS.map(function(k){return '<button type="button" class="key'+(OPS.test(k)?' op':'')+'" data-k="'+k+'" data-for="'+target+'"'+(k==='⌫'?' aria-label="ลบหนึ่งตัว"':'')+'>'+k+'</button>';}).join('')+'</div>';}
function padPress(inp,k){
  var v=inp.value;
  if(k==='⌫')v=v.slice(0,-1);
  else if(OPS.test(k)){if(!v)return;if(OPS.test(v.slice(-1)))v=v.slice(0,-1);v+=k;}
  else if(k==='.'){var last=v.split(OPS).pop();if(last.indexOf('.')>=0)return;v+=(last?'':'0')+'.';}
  else v+=k;
  inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function padOut(inp,out){var v=inp.value,n=calc(v);out.textContent=/[÷×−+*\/\-]/.test(v.slice(1))&&!isNaN(n)?'= '+money(n):'';}
/* ---------- เอฟเฟกต์ตอนบันทึก: อนุภาคกระเด็นออกจากปุ่ม + (ไม่เล่นถ้าเปิดโหมดลดการเคลื่อนไหว) ---------- */
var FXC={i:['#FFD54A','#FFE48A','#5DEBB6','#FFFFFF'],e:['#FF8DA1','#9FB4FF','#FFFFFF'],x:['#8EA2FF','#5FD3FF','#FFFFFF'],g:['#FFD54A','#FF8DA1','#5DEBB6','#8EA2FF','#FFFFFF','#FFB347']};
function fxBurst(kind,n,spread){
  if(!canMotion())return;
  var f=document.getElementById('fab');if(!f)return;
  var old=document.getElementById('fx');if(old)old.remove();
  var r=f.getBoundingClientRect(),box=document.createElement('div');
  box.id='fx';box.style.left=(r.left+r.width/2)+'px';box.style.top=(r.top+r.height/2)+'px';
  var cols=FXC[kind]||FXC.i,cnt=n||(kind==='g'?40:(kind==='e'?8:14)),sp=spread||(kind==='g'?230:(kind==='e'?80:120)),h='';
  for(var k=0;k<cnt;k++){
    var a=-Math.PI*(0.08+0.84*Math.random()),d=sp*(0.45+0.55*Math.random());
    h+='<i class="'+(Math.random()<.5?'star':'')+'" style="--dx:'+Math.round(Math.cos(a)*d)+'px;--dy:'+Math.round(Math.sin(a)*d+36)+'px;--r:'+Math.round(Math.random()*360-180)+'deg;--c:'+cols[k%cols.length]+';--s:'+(kind==='e'?6+Math.round(Math.random()*4):7+Math.round(Math.random()*7))+'px;--t:'+(0.7+Math.random()*0.5).toFixed(2)+'s"></i>';
  }
  box.innerHTML=h;document.body.appendChild(box);
  setTimeout(function(){if(box.parentNode)box.remove();},1500);
}
/* ---------- แจ้งเตือนงบ: เตือนเมื่อรายจ่ายเพิ่งข้ามเกณฑ์ 80% หรือ 100% ของงบเดือน/งบหมวด ---------- */
function monthSum(m,cat){var n=0;S.txs.forEach(function(t){if(t.type==='e'&&t.date.slice(0,7)===m&&(!cat||t.cat===cat))n+=t.amt;});return n;}
function budgetAlert(t,old){
  if(!t||t.type!=='e')return '';
  var m=t.date.slice(0,7),sameM=old&&old.type==='e'&&old.date.slice(0,7)===m;
  var dTot=t.amt-(sameM?old.amt:0),dCat=t.amt-(sameM&&old.cat===t.cat?old.amt:0),msgs=[];
  function chk(limit,after,delta,label){
    limit=+limit;if(!(limit>0)||!(delta>0))return;
    var a=after/limit,b=(after-delta)/limit;
    if(a>=1&&b<1)msgs.push('เกิน'+label+'แล้ว ('+money(after)+' จาก '+money(limit)+')');
    else if(a>=.8&&b<.8)msgs.push('ใช้'+label+'ไปแล้ว '+Math.round(a*100)+'% (เหลือ '+money(limit-after)+')');
  }
  chk(S.budget,monthSum(m),dTot,m===ym(new Date())?'งบเดือนนี้':'งบ'+monthLabel(m));
  chk(S.cb&&S.cb[t.cat],monthSum(m,t.cat),dCat,'งบหมวด'+t.cat);
  return msgs.join(' · ');
}
/* ---------- บันทึกด่วน: รายการที่ใช้บ่อย (ประเภท+หมวด+จำนวน+บัญชี+โน้ต เหมือนกัน เจอซ้ำตั้งแต่ 2 ครั้ง) คำนวณจากประวัติ ไม่เก็บข้อมูลเพิ่ม ---------- */
function quickItems(max){
  var by={};
  S.txs.forEach(function(t){
    if((t.type!=='e'&&t.type!=='i')||t.cat==='ปรับยอด'||t.cat==='เงินตั้งต้น'||!(t.amt>0))return;
    var k=[t.type,t.cat,t.amt,accOf(t),t.note||''].join('|');
    var o=by[k]||(by[k]={type:t.type,cat:t.cat,amt:t.amt,acc:accOf(t),note:t.note||'',n:0,last:''});
    o.n++;if(t.date>o.last)o.last=t.date;
  });
  return Object.keys(by).map(function(k){return by[k];}).filter(function(o){return o.n>=2;})
    .sort(function(a,b){return b.n-a.n||(a.last<b.last?1:-1);}).slice(0,max||6);
}
function quickChips(items){return items.map(function(o,i){return '<button type="button" class="chip qk" data-q="'+i+'">'+miniIcon(o.cat,colorOf(o.cat,o.type))+esc(o.note||o.cat)+' <b class="num">'+(o.type==='i'?'+':'')+money(o.amt)+'</b></button>';}).join('');}
function quickSave(o){
  var today=ymd(new Date()),t={id:uid(),type:o.type,amt:o.amt,cat:o.cat,acc:o.acc,note:o.note,date:today};
  S.month=today.slice(0,7);S.lastAcc=o.acc;
  closeSheet();saveTx(t);fxBurst(o.type);
  var al=budgetAlert(t,null);
  toast('บันทึก '+(o.note||o.cat)+' '+money(o.amt)+' แล้ว'+(al?' · '+al:''),'ยกเลิก',function(){S.txs=S.txs.filter(function(x){return x.id!==t.id;});localSave();render();toast('ยกเลิกรายการแล้ว');});
}
function quickSheet(){
  var items=quickItems(8);
  if(!items.length){entrySheet();toast('ยังไม่มีรายการที่ใช้บ่อย บันทึกรายการเดิมซ้ำอีกครั้งแล้วจะขึ้นที่นี่');return;}
  openSheet('<h3>บันทึกด่วน</h3><p class="hint">แตะเพื่อบันทึกทันทีเป็นวันนี้</p><div class="chips">'+quickChips(items)+'</div><div class="actions"><button type="button" class="btn ghost" id="q-close">ปิด</button><button type="button" class="btn" id="q-new">+ รายการใหม่</button></div>');
  document.querySelector('.sheet').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.q!==undefined)quickSave(items[+b.dataset.q]);
    else if(b.id==='q-close')closeSheet();
    else if(b.id==='q-new')entrySheet();
  });
}
function saveTx(t){
  S.flashId=t.id;setTimeout(function(){S.flashId='';},1200);
  var k=S.txs.findIndex(function(x){return x.id===t.id;});
  if(k>=0)S.txs[k]=t;else S.txs.push(t);
  localSave();render();
}
function delTx(id){
  var gone=S.txs.filter(function(x){return x.id===id;});
  S.txs=S.txs.filter(function(x){return x.id!==id;});localSave();render();
  if(gone.length)undoDelete(gone,'ลบรายการแล้ว');
}
function saveBudget(n){
  S.budget=n;
  localSave();render();
}
function dbErr(e){toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'+(e&&e.code==='quota_exceeded'?' (พื้นที่เต็ม)':''));}
function toast(msg,undoLabel,undoFn){var l=document.getElementById('layer');var d=document.createElement('div');d.setAttribute('role','status');d.className='toast';d.style.cssText='position:fixed;left:16px;right:16px;bottom:96px;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:30;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px';var s=document.createElement('span');s.textContent=msg;d.appendChild(s);
  if(undoFn){var b=document.createElement('button');b.type='button';b.textContent=undoLabel;b.style.cssText='font-weight:700;text-decoration:underline;color:inherit;padding:4px 8px;flex:none';b.addEventListener('click',function(){d.remove();undoFn();});d.appendChild(b);}
  l.appendChild(d);setTimeout(function(){d.remove();},undoFn?7000:3000);}
/* กู้คืนรายการที่เพิ่งลบ (ยอดเงินคงเหลือคำนวณจากรายการ จึงกลับมาเท่าเดิมทันที) */
function undoDelete(list,msg){toast(msg,'กู้คืน',function(){var have={};S.txs.forEach(function(t){have[t.id]=1;});list.forEach(function(t){if(!have[t.id])S.txs.push(t);});localSave();render();toast('กู้คืนแล้ว');});}

function initStore(){localLoad();genRecurring();render();
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&genRecurring()){render();toast('เพิ่มรายการประจำให้แล้ว');}});
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller){showUpdate();}});});
    }).catch(function(){});

var lastViewKey='',enterTimer=0;
function canMotion(){try{return !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){return true;}}
/* นับตัวเลขขึ้นจาก 0 ไปยังค่าจริง (ข้อความสุดท้ายเป็นค่าเดิมเป๊ะ) */
function countUp(root){
  root.querySelectorAll('.bal,.split b').forEach(function(el){
    var txt=el.textContent,m=/^(\D*?)([\d,]+(?:\.\d+)?)(\D*)$/.exec(txt);if(!m)return;
    var to=parseFloat(m[2].replace(/,/g,''));if(!(to>0))return;
    var whole=to%1===0,t0=null,dur=700;
    function step(ts){
      if(!el.isConnected)return;
      if(t0===null)t0=ts;
      var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
      if(p>=1){el.textContent=txt;return;}
      var v=to*e;el.textContent=m[1]+NF.format(whole?Math.round(v):v)+m[3];
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

  var key=S.tab+'|'+S.month+'|'+S.sm+'|'+S.fYear,go=key!==lastViewKey;lastViewKey=key;

  app.classList.add('enter');clearTimeout(enterTimer);

/* ---------- สรุป (เดือน/ปี): ใช้โค้ดชุดเดียวกัน ต่างกันที่ช่วงเวลาและช่วงที่เอาไปเทียบ ---------- */
function prevTx(yr){
  var p=S.month.split('-'),key=yr?String(+p[0]-1):ym(new Date(+p[0],+p[1]-2,1));

}
function groupBy(tx,type,fn){var o={};tx.forEach(function(t){if(t.type!==type)return;var k=fn(t),g=o[k]||(o[k]={v:0,n:0});g.v+=t.amt;g.n++;});return o;}
/* downGood=true: ลดลงถือว่าดี (รายจ่าย) */
function delta(cur,prev,downGood){
  if(!(prev>0))return cur>0?'<span class="dl">ใหม่</span>':'';
  var p=(cur-prev)/prev*100;
  if(Math.abs(p)<1)return '<span class="dl">เท่าเดิม</span>';
  var up=p>0;
  return '<span class="dl '+(up===downGood?'bad':'good')+'">'+(up?'▲':'▼')+Math.round(Math.abs(p))+'%</span>';
}
function statsView(tx,s){return periodView(tx,s,false);}
function yearView(tx,s){return periodView(tx,s,true);}
function periodView(tx,s,yr){
  var ie=tx.filter(function(t){return t.type==='i'||t.type==='e';});
  if(!ie.length)return '<div class="empty">ยังไม่มีรายการ'+(yr?'ในปีนี้':'ในเดือนนี้')+'ให้สรุป</div>';
  var prev=prevTx(yr),ps=sums(prev),pl=yr?'ปีก่อน':'เดือนก่อน';
  var ex=ie.filter(function(t){return t.type==='e';}),now=new Date(),cards=[],net=s.i-s.e,extra='';
  function card(label,val,sub,full){cards.push('<div class="stat"'+(full?' style="grid-column:1/-1"':'')+'><small>'+label+'</small><b class="num">'+val+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>');}
  card('อัตราการออม',s.i>0?Math.round(net/s.i*100)+'%':'–',s.i>0?(net<0?'ใช้เกินรายรับ '+money(-net):'เหลือเก็บ '+money(net)):'ยังไม่มีรายรับ');
  card('รายจ่ายเทียบ'+pl,(ps.e>0?delta(s.e,ps.e,true):'–'),ps.e>0?pl+' '+money(ps.e):'ไม่มีข้อมูล'+pl);
  if(!yr){
    var nd=daysIn(S.month),isCur=S.month===ym(now),el=isCur?now.getDate():nd;
    var perDay=new Array(nd).fill(0);ex.forEach(function(t){perDay[+t.date.slice(8)-1]+=t.amt;});
    var avg=s.e/el,maxDay=0,maxIdx=0;perDay.forEach(function(v,i){if(v>maxDay){maxDay=v;maxIdx=i;}});
    card('ใช้เฉลี่ยต่อวัน',money(avg),isCur?'คาดว่าสิ้นเดือน '+money(avg*nd):'');
    card('วันที่ใช้มากสุด',money(maxDay),maxDay>0?'วันที่ '+(maxIdx+1):'');
    if(S.budget>0&&isCur){var rem=nd-now.getDate()+1,left=S.budget-s.e;card('ใช้ได้ต่อวันตลอดเดือนที่เหลือ ('+rem+' วัน)',left>0?money(left/rem):'เกินงบแล้ว','',true);}
    extra='<h2><span>รายจ่ายรายวัน</span><span class="num">รวม '+money(s.e)+'</span></h2><div class="card" id="daily" style="padding:14px 12px">'+dailyInner()+'</div>';
  }else{
    var inc=new Array(12).fill(0),exp=new Array(12).fill(0);
    ie.forEach(function(t){var m=+t.date.slice(5,7)-1;if(t.type==='i')inc[m]+=t.amt;else exp[m]+=t.amt;});
    var y=+S.month.slice(0,4),months=y===now.getFullYear()?now.getMonth()+1:12,maxM=0,bestM=-1,bestNet=-Infinity,m;
    for(m=0;m<12;m++){if(!inc[m]&&!exp[m])continue;if(exp[m]>exp[maxM])maxM=m;if(inc[m]-exp[m]>bestNet){bestNet=inc[m]-exp[m];bestM=m;}}
    card('ใช้เฉลี่ยต่อเดือน',money(s.e/months),'');
    card('เดือนที่ใช้มากสุด',money(exp[maxM]),MON[maxM]);
    if(bestM>=0)card('เดือนที่เหลือเก็บมากสุด',(bestNet<0?'−':'')+money(Math.abs(bestNet)),MON[bestM]);
    extra='<h2><span>รายรับ–รายจ่ายรายเดือน</span></h2><div class="card" style="padding:12px">'+yearChart(inc,exp)+'<div class="legend"><span><i style="background:var(--inc)"></i>รายรับ</span><span><i style="background:var(--exp)"></i>รายจ่าย</span></div></div><h2><span>รายเดือน (แตะเพื่อดูรายการ)</span></h2><div class="list">';

    }

  h+=catSection(ie,prev,'e',!yr)+catSection(ie,prev,'i',false)+accSection(tx)+weekdaySection(ex)+topSection(ex);

/* แยกตามหมวด ใช้หมวดและสีชุดเดียวกับหน้ารายการ แตะแถวเพื่อดูรายการของหมวดนั้น */
function catSection(tx,prev,type,useBudget){
  var by=groupBy(tx,type,function(t){return t.cat;}),pby=groupBy(prev,type,function(t){return t.cat;});
  var names=Object.keys(by),total=0;
  names.forEach(function(k){total+=by[k].v;});
  if(useBudget)Object.keys(S.cb).forEach(function(c){if(names.indexOf(c)<0)names.push(c);});
  if(!names.length)return '';
  names.sort(function(a,b){return (by[b]?by[b].v:0)-(by[a]?by[a].v:0);});
  var down=type==='e';
  var h='<h2><span>'+(down?'รายจ่าย':'รายรับ')+'แยกตามหมวด</span><span class="num">'+money(total)+'</span></h2><div class="card bars">';
  h+='<div class="stack" aria-hidden="true">'+names.filter(function(c){return by[c];}).map(function(c){return '<i style="width:'+(by[c].v/total*100)+'%;background:'+colorOf(c,type)+'"></i>';}).join('')+'</div>';
  names.forEach(function(c){
    var g=by[c]||{v:0,n:0},v=g.v,b=useBudget?(S.cb[c]||0):0,col=colorOf(c,type),p=total>0?v/total*100:0,pv=pby[c]?pby[c].v:0;
    h+='<button type="button" class="catrow" data-act="drill" data-type="'+type+'" data-cat="'+esc(c)+'" aria-label="ดูรายการหมวด '+esc(c)+'"><div class="top"><span>'+miniIcon(c,col,'cdot')+esc(c)+' <small>'+g.n+' รายการ</small></span><span class="num">'+money(v)+' <small>'+Math.round(p)+'%</small> '+delta(v,pv,down)+'</span></div>';
    if(b>0){
      var pct=v/b*100,fill=pct>100?'var(--exp)':(pct>80?'#D6A21E':col);
      h+='<div class="track" role="progressbar" aria-label="งบ '+esc(c)+'" aria-valuemin="0" aria-valuemax="'+b+'" aria-valuenow="'+Math.round(v)+'"><div class="fill" style="width:'+Math.min(100,pct)+'%;background:'+fill+'"></div></div><small style="color:'+(v>b?'var(--exp)':'var(--muted)')+'">งบ '+money(b)+' · '+(v>b?'เกินงบ '+money(v-b):'เหลือ '+money(b-v))+'</small>';
    }else{
      h+='<div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div>';
    }
    h+='</button>';
  });
  return h+'</div>';
}
/* แยกตามบัญชี: รับ/จ่าย/ยอดสุทธิ และยอดโอนเข้าออก (โอนไม่นับเป็นรายรับรายจ่าย) */
function accSection(tx){

    else if(d[f]){d[f][t.type]+=t.amt;d[f].n++;}
  });

  if(!rows.length)return '';

  rows.forEach(function(a){
    var g=d[a.id],net=g.i-g.e,xt=(g.xi?' · โอนเข้า '+money(g.xi):'')+(g.xo?' · โอนออก '+money(g.xo):'');

var WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
function weekdaySection(ex){

function topSection(ex){

    h+='<button type="button" class="trow" data-id="'+esc(t.id)+'"><span class="dot" style="background:'+colorOf(t.cat,'e')+';width:32px;height:32px">'+dotIcon(t.cat,colorOf(t.cat,'e'))+'</span><span class="m"><div>'+esc(t.note||t.cat)+'</div><small>'+esc(dayLabel(t.date))+' · '+esc(t.cat)+' · '+esc(accName(accOf(t)))+'</small></span><span class="amt num e">−'+money(t.amt)+'</span></button>';

function yearChart(inc,exp){
  var W=340,H=150,L=34,B=20,T=10,max=Math.max.apply(null,inc.concat(exp,[1]));
  var step=niceStep(max),top=Math.ceil(max/step)*step,gw=(W-L-4)/12,ch=H-B-T;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน">';
  for(var v=0;v<=top;v+=step){var y=T+ch-(v/top)*ch;svg+='<line class="gridline" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+(v>=1000?(v/1000)+'k':v)+'</text>';}
  for(var i=0;i<12;i++){
    var x=L+i*gw+2,bw=(gw-4)/2,hi=(inc[i]/top)*ch,he=(exp[i]/top)*ch;
    svg+='<rect class="bar inc" x="'+x+'" y="'+(T+ch-hi)+'" width="'+bw+'" height="'+hi+'" rx="2"/><rect class="bar" x="'+(x+bw)+'" y="'+(T+ch-he)+'" width="'+bw+'" height="'+he+'" rx="2"/><text x="'+(x+bw)+'" y="'+(H-6)+'" text-anchor="middle">'+(i+1)+'</text>';
  }
  return svg+'</svg>';
}
/* รายจ่ายรายวัน: โหมดรายวัน (แท่ง) / สะสม (เส้น เทียบงบ) แตะวันในกราฟหรือใช้ปุ่ม ‹ › เพื่อดูรายการของวันนั้น */
function refreshDaily(){var d=document.getElementById('daily');if(d)d.innerHTML=dailyInner();}
function dailyInner(){
  var ex=monthTx().filter(function(t){return t.type==='e';}),nd=daysIn(S.month),now=new Date(),isCur=S.month===ym(now),el=isCur?now.getDate():nd;
  var per=new Array(nd).fill(0),cnt=new Array(nd).fill(0),cum=[],total=0,maxIdx=0,run=0,i;
  ex.forEach(function(t){var d=+t.date.slice(8)-1;per[d]+=t.amt;cnt[d]++;total+=t.amt;});
  for(i=0;i<nd;i++){if(per[i]>per[maxIdx])maxIdx=i;run+=per[i];cum.push(run);}
  var avg=total/el,sel=S.selDay>=1&&S.selDay<=nd?S.selDay:(isCur?now.getDate():maxIdx+1);
  var W=340,H=176,L=38,R=10,B=22,T=18,cw=W-L-R,ch=H-T-B,gw=cw/nd,byD=S.dm==='d';
  var proj=isCur?avg*nd:total,bud=S.budget>0?S.budget:0;
  var mx=byD?Math.max.apply(null,per.concat([avg,1])):Math.max(total,bud,proj,1);
  var step=niceStep(mx),top=Math.ceil(mx/step)*step;
  function xAt(i){return L+gw*(i+.5);}
  function yAt(v){return T+ch-v/top*ch;}
  function k(v){return v>=1000?(Math.round(v/100)/10)+'k':Math.round(v);}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="group" aria-label="กราฟรายจ่ายรายวัน">',v;
  for(v=0;v<=top;v+=step)svg+='<line class="gridline" x1="'+L+'" x2="'+(W-R)+'" y1="'+yAt(v)+'" y2="'+yAt(v)+'"/><text x="'+(L-5)+'" y="'+(yAt(v)+3)+'" text-anchor="end">'+k(v)+'</text>';
  if(byD){
    for(i=0;i<nd;i++){
      var h=per[i]/top*ch,w=gw*.72,x=L+gw*i+gw*.14,fut=i>=el,cls='dbar'+(fut?' future':'')+(per[i]===0?' zero':'')+(i+1===sel?' sel':''),hh=per[i]>0?Math.max(h,2):1.5;
      svg+='<rect class="'+cls+'" x="'+x+'" y="'+(T+ch-hh)+'" width="'+w+'" height="'+hh+'" rx="'+Math.min(3,w/2)+'"/>';
    }
    var ay=yAt(avg);
    svg+='<line class="avg" x1="'+L+'" x2="'+(W-R)+'" y1="'+ay+'" y2="'+ay+'"/><text x="'+(W-R)+'" y="'+(ay-3)+'" text-anchor="end" class="alab">เฉลี่ย '+money(avg)+'</text>';
    [sel-1,maxIdx].forEach(function(j,n){
      if(n===1&&j===sel-1)return;
      if(per[j]>0)svg+='<text x="'+Math.min(W-R-14,Math.max(L+14,xAt(j)))+'" y="'+(yAt(per[j])-4)+'" text-anchor="middle" class="vlab'+(n===0?' on':'')+'">'+money(per[j])+'</text>';
    });
  }else{
    var base=T+ch,pts=[],j;
    for(j=0;j<el;j++)pts.push(xAt(j)+','+yAt(cum[j]));
    if(bud){
      svg+='<line class="pace" x1="'+L+'" y1="'+base+'" x2="'+(W-R)+'" y2="'+yAt(bud)+'"/><line class="budl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yAt(bud)+'" y2="'+yAt(bud)+'"/><text x="'+(L+3)+'" y="'+(yAt(bud)-4)+'" class="alab bad">งบ '+money(bud)+'</text>';
    }
    svg+='<polygon class="area" points="'+xAt(0)+','+base+' '+pts.join(' ')+' '+xAt(el-1)+','+base+'"/><polyline class="cline" pathLength="1" points="'+pts.join(' ')+'"/>';
    if(isCur&&el<nd)svg+='<line class="proj" x1="'+xAt(el-1)+'" y1="'+yAt(cum[el-1])+'" x2="'+xAt(nd-1)+'" y2="'+yAt(proj)+'"/><text x="'+(W-R)+'" y="'+(yAt(proj)-5)+'" text-anchor="end" class="alab">คาด '+money(proj)+'</text>';
    if(sel<=el)svg+='<line class="selv" x1="'+xAt(sel-1)+'" x2="'+xAt(sel-1)+'" y1="'+T+'" y2="'+base+'"/><circle class="dotc" cx="'+xAt(sel-1)+'" cy="'+yAt(cum[sel-1])+'" r="4"/>';
  }
  for(i=0;i<nd;i++){
    var d=i+1;
    if((d===1||d%5===0||d===sel)&&!(d!==sel&&Math.abs(d-sel)===1))svg+='<text x="'+xAt(i)+'" y="'+(H-7)+'" text-anchor="middle" class="'+(d===sel?'xsel':(isCur&&d===now.getDate()?'today':''))+'">'+d+'</text>';
    svg+='<rect data-day="'+d+'" x="'+(L+gw*i)+'" y="'+T+'" width="'+gw+'" height="'+(ch+B)+'" fill="transparent" style="cursor:pointer"><title>วันที่ '+d+'</title></rect>';
  }
  svg+='</svg>';
  var key=S.month+'-'+pad(sel),dayTx=ex.filter(function(t){return t.date===key;}).sort(function(a,b){return b.amt-a.amt;});
  var h='<div class="dhead"><span class="hint" style="margin:0">'+(byD?'แตะแท่งเพื่อดูรายละเอียดวัน':'เส้นแดง = งบ · จุดเทา = ใช้ตามงบรายวัน')+'</span><div class="seg2" role="group" aria-label="โหมดกราฟ"><button type="button" data-act="dm-d" aria-pressed="'+byD+'">รายวัน</button><button type="button" data-act="dm-c" aria-pressed="'+!byD+'">สะสม</button></div></div>'+svg;
  h+='<div class="dd"><button type="button" class="icon-btn" data-act="dd-prev" aria-label="วันก่อนหน้า">‹</button><div><b>'+esc(dayLabel(key))+'</b> · <span class="num">'+(per[sel-1]?money(per[sel-1]):'ไม่มีรายจ่าย')+'</span><small class="num">'+(cnt[sel-1]?cnt[sel-1]+' รายการ · ':'')+'สะสมถึงวันนี้ '+money(cum[sel-1])+'</small></div><button type="button" class="icon-btn" data-act="dd-next" aria-label="วันถัดไป">›</button></div>';
  if(dayTx.length){
    h+='<div class="list">'+dayTx.slice(0,5).map(function(t){return '<button type="button" class="trow" data-id="'+esc(t.id)+'"><span class="dot" style="background:'+colorOf(t.cat,'e')+';width:30px;height:30px">'+dotIcon(t.cat,colorOf(t.cat,'e'))+'</span><span class="m"><div>'+esc(t.note||t.cat)+'</div><small>'+esc(t.cat)+' · '+esc(accName(accOf(t)))+'</small></span><span class="amt num e">−'+money(t.amt)+'</span></button>';}).join('')+(dayTx.length>5?'<div class="hint" style="margin:8px 14px">และอีก '+(dayTx.length-5)+' รายการ</div>':'')+'</div>';
  }
  return h;
}
function niceStep(max){var raw=max/3,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

/* ---------- sheets ---------- */
function openSheet(html){
  var l=document.getElementById('layer');l.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  var sc=document.getElementById('scrim');
  /* ปุ่มกดตัวเลขทุกแผ่นใช้ตัวจัดการร่วมกันที่นี่ */
  sc.addEventListener('click',function(e){
    if(e.target.id==='scrim'){closeSheet();return;}
    var k=e.target.closest('[data-k]');
    if(k){var inp=document.getElementById(k.dataset.for);if(inp)padPress(inp,k.dataset.k);}
  });
  sc.addEventListener('input',function(e){var o=e.target.id&&sc.querySelector('.calc-out[data-for="'+e.target.id+'"]');if(o)padOut(e.target,o);});
}
/* แก้ตัวเลขในหน้าหลักทันที: แทนที่ปุ่มด้วยช่องกรอก Enter/แตะที่อื่น = บันทึก, Esc = ยกเลิก พิมพ์สูตรได้ เช่น 450+50 */
function inlineEdit(el,val,allowZero,save){
  var inp=document.createElement('input'),done=false;
  inp.type='text';inp.inputMode='decimal';inp.className='inl num';inp.value=val||'';inp.setAttribute('aria-label','แก้ไขตัวเลข');
  function finish(ok){
    if(done)return;done=true;
    var raw=inp.value.trim(),n=calc(raw);
    if(ok&&raw!==''&&(n>0||(allowZero&&n===0))){save(n);return;}
    if(ok&&raw!=='')toast('ตัวเลขไม่ถูกต้อง');
    render();
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();finish(true);}else if(e.key==='Escape')finish(false);});
  inp.addEventListener('blur',function(){finish(true);});
  el.replaceWith(inp);inp.focus();inp.select();
}
function closeSheet(){document.getElementById('layer').innerHTML='';}
/* เดาบัญชีจากหมวด: ใช้บัญชีที่ใช้ล่าสุดกับหมวดและประเภทเดียวกัน (อ่านจากรายการที่มีอยู่ ไม่เก็บข้อมูลเพิ่ม) */
function guessAcc(type,cat){
  var best=null;
  S.txs.forEach(function(x){if(x.type===type&&x.cat===cat&&x.acc&&accById(x.acc)&&(!best||x.date>=best.date))best=x;});
  return best?best.acc:'';
}
function entrySheet(t,isRec){
  var editing=!!t;
  t=t||(isRec?{type:'e',amt:'',cat:'',note:'',day:new Date().getDate()}:{type:'e',amt:'',cat:'',note:'',date:ymd(new Date())});
  var st={type:t.type,cat:t.cat,acc:editing?accOf(t):defAcc(),touched:editing};
  var title=isRec?(editing?'แก้ไขรายการประจำ':'เพิ่มรายการประจำ'):(editing?'แก้ไขรายการ':'เพิ่มรายการ');
  var when=isRec
    ?'<div><label for="f-day">วันที่ของทุกเดือน (1–31)</label><input id="f-day" type="number" inputmode="numeric" min="1" max="31" value="'+esc(t.day)+'"></div>'
    :'<div><label for="f-date">วันที่</label><input id="f-date" type="date" value="'+esc(t.date)+'"></div>';
  var qi=(!editing&&!isRec)?quickItems(5):[];
  var qh=qi.length?'<div class="hint" style="margin:0 0 6px">ใช้บ่อย · แตะเพื่อบันทึกทันที</div><div class="chips">'+quickChips(qi)+'</div>':'';
  var rep=(!isRec&&!editing)?'<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="f-rep"> ทำซ้ำทุกเดือน (ตั้งเป็นรายการประจำ)</label>':'';
  function chips(){var set=S.cats[st.type].slice();if(st.cat&&!set.some(function(c){return c[0]===st.cat;}))set.push([st.cat,'#7A8A96']);return set.map(function(c){return '<button type="button" class="chip" data-cat="'+esc(c[0])+'" aria-pressed="'+(st.cat===c[0])+'">'+miniIcon(c[0],c[1])+esc(c[0])+'</button>';}).join('');}
  openSheet('<h3>'+title+'</h3>'+qh+'<div class="seg"><button type="button" class="e" data-type="e" aria-pressed="'+(st.type==='e')+'">รายจ่าย</button><button type="button" class="i" data-type="i" aria-pressed="'+(st.type==='i')+'">รายรับ</button></div><div class="amount"><span>฿</span><input id="f-amt" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="จำนวนเงิน" value="'+esc(t.amt)+'"></div>'+keypad('f-amt')+'<div class="chips" id="chips">'+chips()+'</div><div class="hint" style="margin:0 0 6px">บัญชีที่ใช้<span id="acc-hint"></span></div><div class="chips" id="accs">'+accChipsHtml(st.acc,'acc')+'</div><div class="field"><div><label for="f-note">โน้ต</label><input id="f-note" type="text" maxlength="60" placeholder="เช่น ข้าวกลางวัน" value="'+esc(t.note)+'"></div>'+when+'</div>'+rep+'<div class="err" id="err" role="alert"></div><div class="actions">'+(editing?'<button type="button" class="btn danger" id="f-del">ลบ</button>':'')+'<button type="button" class="btn ghost" id="f-cancel">ยกเลิก</button><button type="button" class="btn" id="f-save">บันทึก</button></div>');
  var sh=document.querySelector('.sheet');
  function paintAcc(auto){sh.querySelectorAll('#accs .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.acc===st.acc);});var h=document.getElementById('acc-hint');if(h)h.textContent=auto?' · ตามที่ใช้ล่าสุดกับหมวดนี้':'';}
  sh.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.q!==undefined){quickSave(qi[+b.dataset.q]);}
    else if(b.dataset.type){st.type=b.dataset.type;st.cat='';if(!st.touched){st.acc=defAcc();paintAcc(false);}sh.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.type===st.type);});document.getElementById('chips').innerHTML=chips();}
    else if(b.dataset.cat){st.cat=b.dataset.cat;sh.querySelectorAll('#chips .chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.cat===st.cat);});if(!st.touched){var g=guessAcc(st.type,st.cat);st.acc=g||defAcc();paintAcc(!!g);}}
    else if(b.dataset.acc){st.acc=b.dataset.acc;st.touched=true;paintAcc(false);}
    else if(b.id==='f-cancel'){closeSheet();if(isRec)recSheet();}
    else if(b.id==='f-del'){if(isRec){closeSheet();undoableDelRec(t.id);}else{closeSheet();delTx(t.id);}}
    else if(b.id==='f-save'){
      var amt=calc(document.getElementById('f-amt').value);
      var err=document.getElementById('err'),note=document.getElementById('f-note').value.trim();
      if(!(amt>0)){err.textContent='ใส่จำนวนเงินที่มากกว่า 0';return;}
      if(!st.cat){err.textContent='เลือกหมวดหมู่';return;}
      if(isRec){
        var day=parseInt(document.getElementById('f-day').value,10);
        if(!(day>=1&&day<=31)){err.textContent='ใส่วันที่ 1–31';return;}
        saveRec({id:editing?t.id:uid(),type:st.type,amt:amt,cat:st.cat,acc:st.acc,note:note,day:day,start:editing?t.start:ym(new Date()),done:editing?t.done:''});
        var made=genRecurring();render();closeSheet();recSheet();if(made)toast('สร้างรายการให้แล้ว '+made+' รายการ');
        return;
      }
      var date=document.getElementById('f-date').value;
      if(!date){err.textContent='เลือกวันที่';return;}
      var rec={id:editing?t.id:uid(),type:st.type,amt:amt,cat:st.cat,acc:st.acc,note:note,date:date};
      if(editing&&t.rid)rec.rid=t.rid;
      var rp=document.getElementById('f-rep'),repeat=!!(rp&&rp.checked);
      if(repeat)S.rec.push({id:uid(),type:rec.type,amt:rec.amt,cat:rec.cat,acc:rec.acc,note:rec.note,day:+date.slice(8),start:date.slice(0,7),done:date.slice(0,7)});
      S.lastAcc=st.acc;saveTx(rec);genRecurring();S.month=date.slice(0,7);closeSheet();render();
      fxBurst(rec.type);
      var al=budgetAlert(rec,editing?t:null);
      if(repeat)toast('ตั้งเป็นรายการประจำทุกเดือนแล้ว');else if(al)toast(al);
    }
  });
  if(!editing)setTimeout(function(){var a=document.getElementById('f-amt');if(a)a.focus();},50);
}
/* ---------- ธีม: auto(ตามเครื่อง) / light / dark / space (ค่าเริ่มต้น = space) ---------- */

  ['dark','มืด','#0E171C','#16232A','#7C95FF','#0E171C'],

];
function curTheme(){var t='';try{t=localStorage.getItem('rr_theme')||'';}catch(e){}for(var i=0;i<THEMES.length;i++)if(THEMES[i][0]===t)return t;return 'space';}

/* ---------- เป้าหมายออม: ติดตามเงินเก็บแยกจากยอดบัญชี (ไม่หักหรือเพิ่มเงินในบัญชี) เก็บใน rr_goals ---------- */
function cleanGoals(a){
  if(!Array.isArray(a))return [];
  return a.filter(function(g){return g&&typeof g==='object'&&g.id&&typeof g.name==='string'&&g.name.trim()&&+g.target>0;})
    .map(function(g){return {id:String(g.id),name:g.name.trim().slice(0,40),target:+g.target,saved:Math.max(0,+g.saved||0)};});
}
function goalPct(g){return Math.max(0,Math.min(100,g.saved/g.target*100));}
var ROCKET_H='<svg class="grocket" viewBox="0 0 40 24" aria-hidden="true"><g class="gfl"><path d="M9 9.5q-9 2.5 0 5z" fill="#FFB347"/></g><path d="M38 12c-4 4-10 5-16 5H10V7h12c6 0 12 1 16 5z" fill="var(--accent)"/><path d="M20 7l-6-4h-4l3 4zM20 17l-6 4h-4l3-4z" fill="var(--exp)"/><circle cx="25" cy="12" r="2.4" fill="var(--accent-ink)"/></svg>';
function goalBar(g){var p=Math.round(goalPct(g));return '<div class="gtrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'" style="--p:'+p+'"><div class="gfill" style="width:'+p+'%"></div>'+ROCKET_H+'</div>';}
function goalsStrip(){
  if(!S.goals.length)return '<div class="goals"><button type="button" class="link" data-act="goals">+ ตั้งเป้าหมายออม</button></div>';
  return '<div class="goals"><div class="ghead"><span>เป้าหมายออม</span><button type="button" class="link" data-act="goals">จัดการ</button></div>'+S.goals.map(function(g){
    var done=g.saved>=g.target;
    return '<button type="button" class="goal'+(done?' done':'')+'" data-act="goal-dep" data-g="'+esc(g.id)+'"><div class="gtop"><span>'+esc(g.name)+'</span><span class="num">'+money(g.saved)+' / '+money(g.target)+' · '+(done?'ถึงเป้าแล้ว':Math.round(goalPct(g))+'%')+'</span></div>'+goalBar(g)+'</button>';
  }).join('')+'</div>';
}

  h+='<div class="actions"><button type="button" class="btn ghost" id="g-close">ปิด</button><button type="button" class="btn" id="g-add">+ เพิ่มเป้าหมาย</button></div>';

/* ---------- ล็อกแอป: PIN 4 หลัก + ลายนิ้วมือของเครื่อง (WebAuthn) เก็บใน rr_lock = {s:salt, h:แฮช PIN, c:รหัสลายนิ้วมือ}
   เป็นการล็อกหน้าจอกันคนหยิบมือถือไปเปิดดู ไม่ได้เข้ารหัสข้อมูลที่เก็บในเครื่อง ---------- */
function lockCfg(){try{var o=JSON.parse(lsGet('rr_lock')||'null');return o&&o.h&&o.s?o:null;}catch(e){return null;}}
function lockOk(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues&&window.TextEncoder);}
function b64(buf){var a=new Uint8Array(buf),t='';for(var i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t);}
function unb64(s){var t=atob(s),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a;}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function pinHash(pin,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:150000},k,256);}).then(b64);
}
function savePin(pin){
  var salt=b64(rnd(16)),old=lockCfg();
  return pinHash(pin,salt).then(function(h){lsSet('rr_lock',JSON.stringify({s:salt,h:h,c:old?old.c||'':''}));});
}
function verifyPin(pin){var c=lockCfg();if(!c)return Promise.resolve(false);return pinHash(pin,c.s).then(function(h){return h===c.h;});}
var FP_ICO='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a7 7 0 0 0-7 7v1.5"/><path d="M19 12.5V11a7 7 0 0 0-3-5.7"/><path d="M9 20c.6-1.7 1-3.3 1-5v-3a2 2 0 0 1 4 0v1.5c0 2.3-.4 4.2-1.2 6"/><path d="M5 16c.5-1 1-2.2 1-4.5"/><path d="M16.5 14.5c0 1.8-.3 3.4-.8 4.8"/><path d="M12 12v3c0 1.5-.3 3-.9 4.5"/></svg>';
/* แป้นกด PIN: จุด 4 จุด + ปุ่มเลข o={title,sub,fp,extra,onDone(pin,api),onFp(api)} */
function pinPad(box,o){
  var v='',busy=false;
  box.innerHTML='<div class="pin-box"><div class="pin-t">'+o.title+'</div><div class="pin-s" id="pin-s">'+(o.sub||'')+'</div><div class="pin-dots" id="pin-d"><i></i><i></i><i></i><i></i></div><div class="pin-pad">'+['1','2','3','4','5','6','7','8','9'].map(function(k){return '<button type="button" data-pk="'+k+'">'+k+'</button>';}).join('')+(o.fp?'<button type="button" class="ghostk" data-pk="fp" aria-label="ใช้ลายนิ้วมือ">'+FP_ICO+'</button>':'<span></span>')+'<button type="button" data-pk="0">0</button><button type="button" class="ghostk" data-pk="del" aria-label="ลบหนึ่งตัว">⌫</button></div>'+(o.extra||'')+'</div>';
  var dots=box.querySelectorAll('#pin-d i'),sub=box.querySelector('#pin-s'),dd=box.querySelector('#pin-d');
  function paint(){dots.forEach(function(d,i){d.className=i<v.length?'on':'';});}
  var api={
    msg:function(t,bad){sub.textContent=t;sub.className='pin-s'+(bad?' bad':'');},
    bad:function(t){v='';paint();dd.classList.remove('shake');void dd.offsetWidth;dd.classList.add('shake');api.msg(t,true);busy=false;},
    reset:function(){v='';paint();busy=false;}
  };
  box.onclick=function(e){
    var b=e.target.closest('button[data-pk]');if(!b||busy)return;
    var k=b.dataset.pk;
    if(k==='fp'){if(o.onFp)o.onFp(api);return;}
    if(k==='del'){v=v.slice(0,-1);paint();return;}
    if(v.length>=4)return;
    v+=k;paint();
    if(v.length===4){busy=true;var p=v;setTimeout(function(){o.onDone(p,api);},120);}
  };
  return api;
}
var lockTs=0,lockFails=0,lockUntil=0,fpBusy=false;
function unlock(){document.documentElement.classList.remove('locked');document.getElementById('lockscr').innerHTML='';lockTs=0;}
function fpUnlock(api,silent){
  var c=lockCfg();if(!c||!c.c||!navigator.credentials||fpBusy)return;
  fpBusy=true;
  navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(c.c),transports:['internal']}],userVerification:'required',timeout:60000}})
    .then(function(){fpBusy=false;lockFails=0;unlock();})
    .catch(function(){fpBusy=false;if(!silent)api.msg('ใช้ลายนิ้วมือไม่สำเร็จ ลองใหม่หรือใส่ PIN',true);});
}
function showLock(){
  var cfg=lockCfg();
  if(!cfg){unlock();return;}
  document.documentElement.classList.add('locked');
  var box=document.getElementById('lockscr');
  var api=pinPad(box,{title:'ใส่ PIN',sub:'เพื่อเปิดสมุดรายรับรายจ่าย',fp:!!cfg.c,
    extra:'<button type="button" class="link pin-link" id="pin-forgot">ลืม PIN?</button>',
    onDone:function(pin,api){
      var now=Date.now();
      if(now<lockUntil){api.bad('ลองใหม่ได้ในอีก '+Math.ceil((lockUntil-now)/1000)+' วินาที');return;}
      verifyPin(pin).then(function(ok){
        if(ok){lockFails=0;unlock();}
        else{lockFails++;if(lockFails>=5){lockUntil=Date.now()+30000;lockFails=0;api.bad('ใส่ผิดหลายครั้ง รอ 30 วินาที');}else api.bad('PIN ไม่ถูกต้อง');}
      }).catch(function(){api.bad('ตรวจสอบ PIN ไม่สำเร็จ');});
    },
    onFp:function(a){fpUnlock(a);}
  });
  box.querySelector('#pin-forgot').onclick=forgotPin;
  if(cfg.c)setTimeout(function(){fpUnlock(api,true);},350);
}
/* ลืม PIN: ทางเดียวคือรีเซ็ตแอป (ลบข้อมูลในเครื่อง) ต้องพิมพ์คำว่า ลบ เพื่อยืนยัน เก็บสำเนา rr_bak* และธีมไว้ */
function forgotPin(){
  var box=document.getElementById('lockscr'),c=lockCfg();
  box.innerHTML='<div class="pin-box"><div class="pin-t">ลืม PIN?</div><p class="pin-s" style="min-height:0;text-align:left">'+(c&&c.c?'ลองปลดล็อกด้วยลายนิ้วมือก่อน ':'')+'ถ้าจำ PIN ไม่ได้ ทางเดียวคือรีเซ็ตแอป ซึ่งจะ<b>ลบรายการ บัญชี งบ และเป้าหมายทั้งหมดในเครื่องนี้</b> (นำเข้าคืนได้ถ้ามีไฟล์สำรอง) พิมพ์คำว่า <b>ลบ</b> เพื่อยืนยัน</p><div class="field one"><div><input id="rs-word" type="text" autocomplete="off" placeholder="พิมพ์ ลบ"></div></div><div class="actions"><button type="button" class="btn ghost" id="rs-back">กลับ</button><button type="button" class="btn danger" id="rs-go" style="flex:1">รีเซ็ตแอป</button></div></div>';
  box.onclick=null;
  box.querySelector('#rs-back').onclick=showLock;
  box.querySelector('#rs-go').onclick=function(){
    if(box.querySelector('#rs-word').value.trim()!=='ลบ'){box.querySelector('#rs-word').focus();return;}
    try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('rr_')===0&&k.indexOf('rr_bak')!==0&&k!=='rr_theme')localStorage.removeItem(k);});}catch(e){}
    location.reload();
  };
}
document.addEventListener('visibilitychange',function(){
  if(!lockCfg())return;
  if(document.hidden)lockTs=Date.now();
  else if(lockTs&&Date.now()-lockTs>30000)showLock();

/* ตั้งค่า: หน้าล็อกแอป */
function pinSheet(title,sub,onDone,back){
  openSheet('<div id="pin-host"></div><div class="actions" style="margin-top:14px"><button type="button" class="btn ghost" id="pin-cancel">ยกเลิก</button></div>');
  var api=pinPad(document.getElementById('pin-host'),{title:title,sub:sub,onDone:onDone});
  document.getElementById('pin-cancel').onclick=function(){if(back)back();else closeSheet();};
  return api;
}
function setPinFlow(msg){
  pinSheet('ตั้ง PIN',msg||'ใส่ PIN 4 หลักที่ต้องการ',function(p1){
    pinSheet('ยืนยัน PIN','ใส่ PIN เดิมอีกครั้ง',function(p2,api2){
      if(p1!==p2){setPinFlow('PIN ไม่ตรงกัน ลองตั้งใหม่');return;}
      savePin(p1).then(function(){lockSheet();toast('ตั้ง PIN แล้ว');}).catch(function(){api2.bad('บันทึก PIN ไม่สำเร็จ');});
    },lockSheet);
  },lockSheet);
}
function verifyThen(title,cb){
  pinSheet(title,'ใส่ PIN ปัจจุบัน',function(p,api){verifyPin(p).then(function(ok){if(ok)cb();else api.bad('PIN ไม่ถูกต้อง');});},lockSheet);
}
function enrollFp(done){
  if(!window.PublicKeyCredential||!navigator.credentials){done(false,'เบราว์เซอร์นี้ไม่รองรับลายนิ้วมือ');return;}
  var chk=PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():Promise.resolve(true);
  chk.then(function(av){
    if(!av){done(false,'เครื่องนี้ยังไม่ได้ตั้งค่าลายนิ้วมือหรือการล็อกหน้าจอ');return;}
    return navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'สมุดรายรับรายจ่าย'},user:{id:rnd(16),name:'local-user',displayName:'ผู้ใช้'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}})
      .then(function(cred){var c=lockCfg();c.c=b64(cred.rawId);lsSet('rr_lock',JSON.stringify(c));done(true);});
  }).catch(function(){done(false,'ตั้งค่าลายนิ้วมือไม่สำเร็จ');});
}
function lockSheet(){
  var cfg=lockCfg(),h='<h3>ล็อกแอป</h3>';
  if(!lockOk())h+='<p class="hint">เบราว์เซอร์นี้ไม่รองรับการล็อก (ต้องเปิดผ่าน https)</p><div class="actions"><button type="button" class="btn ghost" id="l-close">ปิด</button></div>';
  else if(!cfg)h+='<p class="hint">ตั้ง PIN 4 หลักเพื่อกันคนอื่นเปิดดูรายการของคุณ และเปิดใช้ลายนิ้วมือของเครื่องเพื่อปลดล็อกเร็วขึ้นได้ ระบบจะล็อกอัตโนมัติเมื่อออกจากแอปเกิน 30 วินาที</p><div class="actions"><button type="button" class="btn ghost" id="l-close">ปิด</button><button type="button" class="btn" id="l-set">ตั้ง PIN</button></div>';
  else h+='<p class="hint">เปิดใช้งานอยู่ · ล็อกอัตโนมัติเมื่อออกจากแอปเกิน 30 วินาที</p><div class="actions" style="margin-bottom:10px"><button type="button" class="btn ghost" id="l-fp">'+(cfg.c?'ปิดลายนิ้วมือ':'เปิดลายนิ้วมือ')+'</button><button type="button" class="btn ghost" id="l-change">เปลี่ยน PIN</button></div><div class="actions" style="margin-bottom:10px"><button type="button" class="btn ghost" id="l-now">ล็อกตอนนี้</button><button type="button" class="btn danger" id="l-off" style="flex:1">ปิดการล็อก</button></div><div class="actions"><button type="button" class="btn ghost" id="l-close">ปิด</button></div>';
  h+='<p class="hint" style="margin-top:14px">การล็อกนี้กันคนหยิบมือถือไปเปิดดู ไม่ได้เข้ารหัสข้อมูลในเครื่อง ถ้าลืม PIN ต้องรีเซ็ตแอป ควรสำรองข้อมูลไว้เสมอ</p>';
  openSheet(h);
  document.querySelector('.sheet').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='l-close')closeSheet();
    else if(b.id==='l-set')setPinFlow();
    else if(b.id==='l-change')verifyThen('เปลี่ยน PIN',function(){setPinFlow('ใส่ PIN ใหม่ 4 หลัก');});
    else if(b.id==='l-off')verifyThen('ปิดการล็อก',function(){try{localStorage.removeItem('rr_lock');}catch(x){}lockSheet();toast('ปิดการล็อกแล้ว');});
    else if(b.id==='l-now'){closeSheet();showLock();}
    else if(b.id==='l-fp'){
      if(cfg.c){cfg.c='';lsSet('rr_lock',JSON.stringify(cfg));lockSheet();toast('ปิดลายนิ้วมือแล้ว');}
      else enrollFp(function(ok,msg){if(ok){lockSheet();toast('เปิดลายนิ้วมือแล้ว');}else toast(msg);});
    }
  });
}

    else if(b.id==='s-lock')lockSheet();
